# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
jobs:
  e2e:
    docker:
      # specify the version you desire here
      - image: circleci/node:10.15
        # env:
        #   - DISPLAY=:99
        #   - CHROME_BIN=/usr/bin/google-chrome
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run:
          name: Install Dependencies
          command: |
            sudo apt-get update
            wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || echo '\ninstall failed - but its fine we just wanted a dependency list\n'
            sudo apt-get -f install -y
            sudo dpkg -i google-chrome-stable_current_amd64.deb
            yarn install
            node node_modules/protractor/bin/webdriver-manager update --versions.chrome=$(google-chrome --version | cut -d ' ' -f 3)

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run:
          name: Build Application
          command: yarn run build:ci
      - run:
          name: Serve and Test
          command: (yarn run server:ci &) && sleep 2 && yarn run e2e:ci
      - store_test_results:
          path: ./output
      - store_artifacts:
          path: ./output
  unit:
    docker:
      - image: circleci/node:10.15

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-
      - run:
          name: Install Dependencies
          command: yarn install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
      - run:
          name: Run tests
          command: yarn test:ci
      - store_test_results:
          path: ./output
workflows:
  version: 2
  test:
    jobs:
      - e2e
      # - version:
      #     filters:
      #       branches:
      #         only:
      #           - dev
      - unit
