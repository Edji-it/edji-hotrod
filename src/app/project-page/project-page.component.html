<side-bar has-comment-count="true"></side-bar>
  
<div class="container container--side-bar">

  <section class="project-column header-padding" [ngClass]="{ loading: !project._id }">
    <p class="banner-error" *ngIf="error">{{ error }}</p>
    <!--<emoji-annotator project-fn="getSession()"></emoji-annotator>-->
    <annotator *ngIf="project._id" [project]="project"></annotator>
  </section>
  
  <div class="reading__hud">
    <label id="projectTitle" >{{ project.label }}</label>
    
    <div class="hud__info"> 
      <pre class="project-code--inline">{{project.code || 'none'}}</pre>
      <span [innerHtml]="':key:' | emojione"></span>
      <br/>
      {{liveCount}} Readers 
      <span [innerHtml]="':fire:' | emojione"></span>
    </div>
  </div>

  <!--<feedback-form *ngIf="user.isTeacher"></feedback-form>-->
</div>
