  <div id="InfoHud" class="reading__hud">
    <div class="prj">
      <span class="prj-label">Project: </span>
      <label id="projectTitle" class="prj-name">{{ project.label }}</label>
      <br/>
      <label id="projectCreate" class="prj-label">Started {{ createDate }}</label>
      <br/>
      <label id="projectComments" class="prj-label">{{ commentCount }} Comments</label>
    </div>
    
    <div class="hud__info"> 
      <pre class="project-code--inline">{{project.code || 'none'}}</pre>
      <span [innerHtml]="':key:' | emojione"></span>
      <br/>
      {{liveCount}} Readers 
      <span [innerHtml]="':fire:' | emojione"></span>
    </div>
  </div>

  <div class="project-column header-padding" [ngClass]="{ loading: !project._id }">
    <p class="alert alert-danger" *ngIf="error">{{ error }}</p>
    <!--<emoji-annotator project-fn="getSession()"></emoji-annotator>-->
    <annotator #annotator *ngIf="project._id" [project]="project"></annotator>
  </div>

</div>
  
<edji-feedback></edji-feedback>
<hot-login-modal class="modal-will-fade" [class.show]="showLoginModal" (closeModal)="showLoginModal = false"></hot-login-modal>
