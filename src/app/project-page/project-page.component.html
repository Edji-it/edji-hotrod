<side-bar [hasCommentCount]="true" ></side-bar>

<div class="container-fluid">
  <div class="project-column" [ngClass]="{ loading: !project._id }">
    <div id="InfoHud" class="reading__hud">
      <div class="prj">
        <label id="projectCreate" class="prj-label">Started {{ createDate }}</label>
        <br/>
        <label id="projectComments" class="prj-label">{{ commentCount ? commentCount.count : 0 }} Comments</label>
      </div>
      
      <div class="hud__info"> 
        <pre class="project-code--inline">{{project.code || 'none'}}</pre>
        <span [innerHtml]="':key:' | emojione"></span>
        <br/>
        {{liveCount}} Readers 
        <span [innerHtml]="':fire:' | emojione"></span>
      </div>
    </div>

    <p class="alert alert-danger" *ngIf="error">{{ error }}</p>
    <annotator #annotator *ngIf="project._id" [project]="project"></annotator>
  </div>

</div>
<edji-feedback></edji-feedback>
<hot-login-modal [projectId]="project._id" class="modal-will-fade" [class.show]="showLoginModal" (closeModal)="showLoginModal = false"></hot-login-modal>
