<!--<hot-project-info></hot-project-info>-->
<side-bar [hasCommentCount]="true"></side-bar>

<div class="container-fluid container--side-bar">

   <div class="reading__hud">
    <label id="projectTitle" >{{ project.label }}</label>
    
    <div class="hud__info"> 
      <pre class="project-code--inline">{{project.code || 'none'}}</pre>
      <span [innerHtml]="':key:' | emojione"></span>
      <br/>
      {{liveCount}} Readers 
      <span [innerHtml]="':fire:' | emojione"></span>
    </div>
  </div>

  <section class="project-column header-padding" [ngClass]="{ loading: !project._id }">
    <p class="alert alert-danger" *ngIf="error">{{ error }}</p>
    <!--<emoji-annotator project-fn="getSession()"></emoji-annotator>-->
    <annotator #annotator *ngIf="project._id" [project]="project"></annotator>
  </section>

</div>

<edji-feedback *ngIf="user.isTeacher"></edji-feedback>
