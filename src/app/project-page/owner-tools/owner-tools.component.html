<div class="owner-bar">
  <label>Owner</label>
  <!--Comment Stats pane-->
  <button *ngIf="currentProject && user._id == currentProject.teacher_id && hasCommentCount" type="button" class="btn btn-clear side-bar__icon-button btn-cmt" aria-label="Comment Counts" (click)="showCommentCounts = !showCommentCounts" style="width: 70px;">
    <img *ngIf="isMobile" style="width: 50px;" src="assets/images/icon-comment.svg" />
    <img *ngIf="!isMobile" src="assets/images/icon-comment.svg" />
    <span>{{ commentStats ? commentStats.count : 0 }}</span>
  </button>

  <!--Heat Vision toggle-->
  <button *ngIf="currentProject && user._id == currentProject.teacher_id" type="button" class="btn btn-clear side-bar__icon-button btn-hv"  placement={{tooltipPlacement}} ngbTooltip="Turn on Heat Vision to let readers see comments from other readers, turn it off to make comments private!">
    <i id="toggleHeatVision" *ngIf="currentProject" (click)="togglePower('heat_vision', !this.currentProject.heat_vision)" class="icon-heatvision" [ngClass]="[!currentProject.heat_vision ? 'inactive' : 'active']" ></i>
    <i [class.is-loading]="powersLoading.heatVision" class="power__loading loading"></i>
  </button>
</div>


<!--Comments Pane-->
<div class="sliding-pane mid-bar from-left" [ngClass]="{ 'slide-in' : showCommentCounts }">
  <div class="container-fluid">
    <h4>
    <i class="fa fa-chevron-left btn-icon"></i>
    {{ commentStats && commentStats.users ? commentStats.users.length : 0 }} Students
    </h4> 
    <div class="user-list-item" style="opacity: 0.3; margin-bottom: 14px;">
      <span>Username</span> 
      <b style="float:right;">Comments</b>
    </div>
    <div *ngFor="let commentUser of commentStats.users" class="user-list-item">
      <span>{{ commentUser.name }}</span> 
      <b style="float:right;">{{ commentUser.count }}</b>
    </div>
  </div>
</div>
