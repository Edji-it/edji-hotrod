<div *ngIf="currentProject && user._id == currentProject.teacher_id" class="owner-bar">
  <label class="bar-title">Owner</label>
  <!--Comment Stats pane-->
  <button type="button" class="btn owner-tools__btn btn-cmt" aria-label="Comment Counts" (click)="showElseFalse('showCommentCounts')">
    <!--<img *ngIf="isMobile" style="width: 50px;" src="assets/images/icon-comment.svg" />-->
    <img src="assets/images/icon-leaderboard.svg" />
    <label>Tally</label>
  </button>

  <!--Heat Vision toggle-->
  <button type="button" class="btn owner-tools__btn btn-hv" (tap)="togglePower('heat_vision', !this.currentProject.heat_vision)" >
      <!--placement={{tooltipPlacement}} ngbTooltip="Turn on Heat Vision to let readers see comments from other readers, turn it off to make comments private!"-->
    <i id="toggleHeatVision" *ngIf="currentProject" class="icon-heatvision" [ngClass]="[!currentProject.heat_vision ? 'inactive' : 'active']" ></i>
    <i [class.is-loading]="powersLoading.heatVision" class="power__loading loading"></i>
    <span *ngIf="currentProject.heat_vision" class="badge badge-pill badge-primary">
      On</span>
    <span *ngIf="!currentProject.heat_vision" class="badge badge-pill badge-secondary">
      Off</span>
    <label>Vision</label>
  </button>

  <!--Fire Feed toggle-->
  <button type="button" class="btn owner-tools__btn btn-hv" (tap)="showElseFalse('showFireFeed')">
    <i id="toggleFirefeed" *ngIf="currentProject" class="icon-fire-feed"></i>
    <span *ngIf="commentStats.stats.count && commentStats.stats.count > 0" class="badge badge-pill badge-info">
      {{ commentStats.stats.count }}</span>
    <label>Feed</label>
  </button>

  <!--Question Feed toggle-->
  <div *ngIf="currentReading.questions && currentReading.questions.length>0">
    <button type="button" class="btn owner-tools__btn btn-hv" (tap)="showElseFalse('showQuestionFeed')">
      <i id="toggleQuestionfeed" *ngIf="currentProject" class="icon-question"></i>
      <label>Questions</label>
    </button>
  </div>
</div>


<!--Leaderboard goes here-->
<hot-leaderboard (hide)="showCommentCounts=false" [commentStats]="commentStats" [visible]="showCommentCounts"></hot-leaderboard>

<!--Fire Feed goes here-->
<hot-firefeed (hide)="showFireFeed=false" [visible]="showFireFeed"></hot-firefeed>

<!--Question Feed goes here-->
<hot-questionfeed (hide)="showQuestionFeed=false" [visible]="showQuestionFeed"></hot-questionfeed>
