<div class="questionBound">
  <div class="user-icon">
    <span>{{ questionBlock.question_number }}</span>
  </div>
  <div class="questionBlock">
    <div class="prompt">{{ questionBlock.prompt }}</div>
    <button class="button-answers__hide btn btn-sm btn-gray" (click)="answersHidden = !answersHidden" [class.hidden]="">
      {{ answersHidden ? 'HIDE' : 'SHOW' }}
    </button>
    <div *ngIf="answersHidden">
      <div *ngFor="let answer of answersById[questionBlock._id]">
        <div class="comment-wrap-row">
          <edji-comment
            class="questionAnswerBlock"
            [comment]="answer"
            [commentContext]="'answer'"
            [isActive]="answer.active"
            [reply]="true"
          ></edji-comment>
        </div>
      </div>
    </div>
  </div>
</div>
