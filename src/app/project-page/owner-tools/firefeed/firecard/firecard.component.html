<hr class="fireBlock-hr" *ngIf="commentMobile && !commentMobileFirst">
<div class="fireBound" [ngClass]="[ commentMobile ? 'fireBlock-mobile-comment' : '' ]">
    <div class="user-icon" [ngClass]="[ commentMobile ? 'fireBlock-mobile-comment' : '' ]">
        <span>{{fireComment.author.substring(0,2)}}</span>
    </div>
    <div class="fireBlock" [ngClass]="[ commentMobile ? 'fireBlock-mobile-comment' : '' ]">
        <div class="list-item list-item--block fireTime-card">
            {{fireComment.author}}<span class="fireTime-card__time">&nbsp;{{ fireComment.createdAt | edjidate:'timeAgo':null:secondsAgo }}</span>
        </div>
        <!--Emoji Comment display-->
        <div class="list-item list-item--block fireComment-card" *ngIf="fireComment.type == 'emoji' || !fireComment.type">
            <div class="emoji-comment-input" 
                [innerHtml]="fireComment.data && fireComment.data.length > 0 ? (fireComment.data | emojione) : '<span class=\'sample-placeholder\'>Empty...</span>'"></div>
        </div>
        <!--Text Comment display-->
        <div class="list-item list-item--block fireComment-card" *ngIf="fireComment.type == 'text'" 
            [innerHtml]="fireComment.data && fireComment.data.length > 0 ? (fireComment.data | linkify | emojione) : '<span class=\'sample-placeholder\'>Empty...</span>'"></div>
        <!--Audio comment display-->
        <div class="list-item list-item--block fireComment-card fireCard-audio" *ngIf="fireComment.type == 'audio'">
            <button class="btn-audio btn-fc-audio" [class.disabled]="!playAble">
                <i [class.hide]="isPlaying" class="icon-play" (click)="play()"></i>
                <i [class.hide]="!isPlaying" class="icon-pause" (click)="pause()"></i>
            </button>
            <button class="btn-audio btn-fc-audio" (click)="isRecording=false; isPlaying=false; restartPlayback()"><i class="icon-restart"></i></button>
            <div class="wave-wrap">
                <canvas (click)="setPlaybackTime($event)"  class="wave-form"></canvas>
                <div [class.hide]="!audio || !audio.currentTime" class="playing" [style.width]="getPlayhead() + '%'"></div>
            </div>
        </div>
        <div class="list-item list-item fireHighlight-card h-1" *ngIf="!isImage">
            {{ fireComment.text ? fireComment.text : '...'}}
        </div>
        <div class="list-item list-item fireHighlight-card_liImage h-1" *ngIf="isImage">
            <div class="fireHighlight-card_image">Image</div>
            <button class="fireHighlight-card_button" (click)="getImagePos(fireComment.start)">View&nbsp;&#8594;</button>
        </div>
    </div>
</div>
