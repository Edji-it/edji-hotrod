<div class="fireBound">
    <div class="fire-icon">
        <span>{{fireComment.author.substring(0,2)}}</span>
    </div>
    <div class="fireBlock">
        <div class="list-item list-item--block fireTime-card">
            {{fireComment.author}}<span class="fireTime-card__time">&nbsp;{{ fireComment.createdAt | edjidate:'timeAgo' }}</span>
        </div>
        <div class="list-item list-item--block fireComment-card" *ngIf="fireComment.type == 'emoji' || !fireComment.type">
            <div *ngIf="fireComment.data.length > 0" class="emoji-comment-input" [innerHtml]="fireComment.data | emojione"></div>
        </div>
        <div class="list-item list-item--block fireComment-card" *ngIf="fireComment.type == 'text'">
            {{ fireComment.data }}
        </div>
        <div class="list-item list-item fireHighlight-card h-1" *ngIf="!isImage">
            {{ fireComment.text ? fireComment.text : '...'}}
        </div>
        <div class="list-item list-item fireHighlight-card_liImage h-1" *ngIf="isImage">
            <div class="fireHighlight-card_image">Image</div>
            <button class="fireHighlight-card_button" (click)="getImagePos(fireComment.start)">View&nbsp;<span><i class="icon-right_arrow"></i></span></button>
        </div>
    </div>
</div>
