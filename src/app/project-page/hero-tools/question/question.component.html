<div class="question-container row">
  <!-- Question Number
      - Everything is spaced to the right of this.
  -->
  <div class="number-container">
    <div class="question-number">3</div>
  </div>
  <!-- Question Body - aka Everything else -->
  <div class="question-body">
    <!-- The Question Prompt Section -->
    <div class="prompt-section">
      <label class="question-label">QUESTION</label>
      <div class="prompt">{{question.prompt}}</div>
    </div>
    <!--<button (tap)="removeQuestion()" class='inline-delete'>+</button>-->
    <!-- Answers Section -->
    <div class="answers-section">
      <label class="answer-label">ANSWERS</label>
      <!-- The Answers.
        - If the user has answered, they can see the other answers.
        - Otherwise, give them options to answer.
      -->
      <div class="answer-block">
        <div class="answer-options">
          <!-- Emoji Answer Button -->
          <button id="addEmojiComment" 
						class="emoji comment__options--mobileButton" 
						(tap)="addAnswerOfType('emoji')">
							<i class="icon icon-emoji-comment"></i>
					</button>
          <!-- Text Answer Button -->
          <button id="addTextComment"
						class="emoji comment__options--mobileButton" 
						(tap)="addAnswerOfType('text')">
							<i class="icon icon-text-comment"></i>
					</button>
        </div>
        <!-- ANSWERS -->
        <div class="answer-list">
          <div *ngFor="let answer of question.answers">
            <edji-comment class="answer list-item" 
              [comment]="answer" 
              [isActive]="answer.active" 
              [answer]=true
              [assignedQuestion]="question"
              [userPermission]="getCommentPermissions(answer)"
              ></edji-comment>
          </div><!-- answers loop -->
        </div><!-- answer list -->
      </div><!-- answer block -->
    </div>
    <!-- Answer Type Entry -->
    <!--<div>
      <div class="question__section-header">ANSWER TYPES</div>
      <div>BLOCK</div>
      <div class="question__section-header">OPTIONS</div>
      <div>BLOCK</div>
    </div>-->
  </div>
</div>
