<div class="question-container row">
  <!-- Question Number
      - Everything is spaced to the right of this.
  -->
  <div class="number-container">
    <div class="question-number">3</div>
  </div>
  <!-- Question Body - aka Everything else -->
  <div class="question-body" [ngClass]="[question.new ? 'question-body__new' : '']">
    <!-- The Question Prompt Section -->
    <div class="prompt-section">
      <label class="question-label">QUESTION</label>
      <div *ngIf="question && !question.new" class="prompt">{{question.prompt}}</div>
      <textarea *ngIf="question && question.new" type='text' placeholder="Question text..." class="text-comment-input" [(ngModel)]="question.prompt"></textarea>
    </div>
    <!--<button (tap)="removeQuestion()" class='inline-delete'>+</button>-->
    <!-- Answer Type During Question Creation -->
    <div class="answer-label">ANSWER TYPES</div>
    <div class="answer-options">
      <!-- Emoji Answer Button -->
      <button *ngFor="let type of ['emoji', 'text', 'audio']" id="selectAnswer" 
        class="emoji" 
        (tap)="addAnswerOfType(type)">
          <i class="icon icon-{{type}}-comment"></i>
      </button>
    </div>
    <div class="answer-label">OPTIONS</div>
    <div class="answer-options">
      <!-- Emoji Answer Button -->
      <button *ngFor="let type of ['public', 'lock']" id="selectOption" 
        class="emoji" 
        (tap)="selectOptionType(type)">
          <i class="icon icon-{{type}}-comment"></i>
      </button>
    </div>
  </div>
  <!-- Answers Section -->
    <div class="answers-section">
      <label class="answer-label">ANSWERS</label>
      <!-- The Answers.
        - If the user has answered, they can see the other answers.
        - Otherwise, give them options to answer.
      -->
      <div class="answer-list">
        <div *ngFor="let answer of question.answers">
          <edji-comment class="answer list-item" 
            [comment]="answer" 
            [isActive]="answer.active" 
            [userPermission]="getCommentPermissions(answer)"
            ></edji-comment>
        </div><!-- answers loop -->
      </div><!-- answer list -->
    </div>
</div>
