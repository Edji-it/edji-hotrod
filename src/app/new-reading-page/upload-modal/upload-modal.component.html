<div id="uploadModal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form>   <!--(ngSubmit)=""-->
                <div class="modal-header">
                    <h4 class="modal-title">Add a Picture</h4>
                    <button (click)="closeModal.emit()" type="button" class="close btn-icon--round" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">

                    <input type="file" id="file-input" />
                    <p id="status">Please select a file</p>
                    <img [src]="uploadedUrl" />
                </div>
                <div class="modal-footer">
                    <button (click)="beginUpload()" type="submit" class="btn btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>
</div>
