<div id="uploadModal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form>   <!--(ngSubmit)=""-->
                <div class="modal-header">
                    <h4 class="modal-title">Add a Picture</h4>
                    <button (click)="closeModal.emit()" type="button" class="close btn-icon--round" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!--<label class="custom-file">
                        <input type="file" id="file-input" class="file-input">
                        <span class="custom-file-control"></span>
                    </label>-->

                    <label class="btn btn-default btn-file">
                        Browse <input id="file-input" type="file" style="display: none;">
                    </label>
                    
                    <button (click)="beginUpload()" type="submit" class="btn btn-primary">Upload</button>

                    <hr />
                    
                    <p id="status">Select an image to insert into your Reading</p>

                    <div class="card-columns">
                        <div *ngFor="let uploadedUrl of uploadedUrls; let i = index" [class.selected]="selectedIndex == i" (click)="selectedIndex = i" class="card upload-list-item">
                            <img class="card-img-top img-fluid" [src]="uploadedUrl" />
                            <!--<div class="card-block">
                                <p class="card-text">This is a longer card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
                            </div>-->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button (click)="insertImage()" [disabled]="!uploadedUrls[0]" type="submit" class="btn btn-primary">Insert</button>
                </div>
            </form>
        </div>
    </div>
</div>
