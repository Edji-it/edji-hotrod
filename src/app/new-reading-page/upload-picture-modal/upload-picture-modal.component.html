<div id="uploadModal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form>   <!--(ngSubmit)=""-->
                <div class="modal-header">
                    <h4 class="modal-title">Add a Picture</h4>
                    <button (click)="closeModal.emit()" type="button" class="close btn-icon--round" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!--<label class="custom-file">
                        <input type="file" id="file-input" class="file-input">
                        <span class="custom-file-control"></span>
                    </label>-->
                    <form>
                    <label #browseBtn class="btn btn-default btn-file">
                        Browse <input id="imageFileInput" type="file" 
                            accept=".jpg,.png,.gif,.jpeg,.svg"
                            (change)="updateUploadFile()" style="display:none;">
                    </label>

                    <div class="file-name" (click)="browseBtn.click()">
                        <span *ngIf="!this.file || !this.file.name || this.file.name.length < 1" class="placeholder">Select image to upload...</span>
                        {{ this.file ? this.file.name : '' }}
                    </div>
                    
                    <!--Breaks test: [disabled]="noUploadAllowed"-->
                    <button id="buttonBeginImageUpload" (click)="beginUpload()" type="submit" class="btn btn-primary" 
                        [class.loading]="uploading">Upload</button>
                    </form>

                    <div *ngIf="errorMsg" class="alert alert-warning">
                        {{ errorMsg }}
                    </div>

                    <hr />
                    
                    <p id="status">Select an image to insert into your Reading</p>

                    <div class="card-columns">
                        <ng-container *ngFor="let image of uploadedImages; let i = index">
                            <div *ngIf="i < 30" (click)="insertImage(i)" [class.new]="newImgUrls.indexOf(image.url) > -1" class="card upload-list-item">
                                <img class="card-img-top img-fluid" [src]="image.url" [title]="image.title" />
                                <div class="card-img-overlay overlay-on-hover">
                                    <button class="btn btn-primary btn--center-overlay">Insert</button>
                                </div>
                            </div>
                        </ng-container>
                    </div>
                </div>
                <div class="modal-footer">
                    <!--<button (click)="insertImage()" [disabled]="!uploadedUrls[0]" type="submit" class="btn btn-primary">Insert</button>
                    <button (click)="insertImage()" [disabled]="!uploadedUrls[0]" type="submit" class="btn btn-primary">Cancel</button>-->
                </div>
            </form>
        </div>
    </div>
</div>
