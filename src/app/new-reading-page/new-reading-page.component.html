<side-bar></side-bar>

<div class="container container--side-bar">
    <div class="row">
        <div class="col-sm-12">
            <h1>{{ reading._id ? 'Edit Reading' : 'New Reading' }}</h1>


             <form [formGroup]="readingForm" (ngSubmit)="onSubmit(readingForm.value)">
                <div  class="reading-page">
                    <div class="form-group offset-label--wrap">
                        <label class="border-wrap">
                            <span class="offset-label">Title</span>
                            <input type="text" id="readingTitle" class="form-control form-item--seamless h1 input-noborder mTitle" placeholder="Reading Title..." [formControl]="readingForm.controls['title']"/>
                            <div id="errorTitle" *ngIf="readingForm.controls['title'].hasError('required') && (readingForm.controls['title'].dirty || submitted)"  class="alert alert-info">Please give your Reading a title!</div>
                        </label>
                    </div>
                    <div class="form-group offset-label--wrap">
                        <label class="border-wrap">
                            <span class="offset-label">Content</span>
                            <medium-editor
                                [(editorModel)]="readingHtml"
                                [editorOptions]="mediumEditorConfig"
                                [editorPlaceholder]="readingPlaceholder"
                                id="readingContent"
                                class="content"></medium-editor>
                            <div id="errorContent" *ngIf="submitted && readingIsBlank"  class="alert alert-info">Please give your Reading some text!</div>
                        </label>
                        <div class="editor-button-bar">
                            <a id="buttonUploadImage" class="btn btn-icon--plain" (click)="showUploadModal = true">
                                <img title="Add Picture" class src="/assets/images/icon-picture.svg" />
                            </a>
                            <a id="buttonUploadPdf" class="btn btn-icon--plain" (click)="showPdfUploadModal = true">
                                <img title="Add PDF" class src="/assets/images/icon-pdf.svg" />
                            </a>
                        </div>
                    </div>
                    <div class="form-group offset-label--wrap">
                        <label class="border-wrap ">
                            <span class="offset-label" title="Optionally link to where this Reading came from!">Link to Source
                            </span>
                            <div class="input-group">
                                <input type="url" id="readingSource" class="form-control form-item--seamless h3 mSource" placeholder="New Reading Source..." [formControl]="readingForm.controls['source']" />
                                <i class="input-group-tooltip icon__tooltip" placement="left" ngbTooltip="Keep a link to the source, so you don't lose it!">
                                    <i class="icon icon-circle icon-info">i</i>
                                </i>
                            </div>
                        </label>
                    </div>
                    <div class="form-group offset-label--wrap">
                        <label class="border-wrap ">
                            <span class="offset-label hidden-sm-down" title="First Group you will share this Reading with ">First Group
                            </span>
                            <span class="offset-label hidden-md-up groupLabel" title="First Group you will share this Reading with ">Group Name
                            </span>
                            <div class="input-group">
                                <input type="text" id="firstProjectLabel" class="form-control form-item--seamless h3 mGroup" placeholder="eg. First Period, Peer review..." [formControl]="readingForm.controls['label']" />
                                <i class="input-group-tooltip icon__tooltip" placement="left" ngbTooltip="What should the first copy you share be labeled?">
                                    <i class="icon icon-circle icon-info">i</i>
                                </i>
                            </div>
                            <div id="errorGroupLabel" *ngIf="readingForm.controls['label'].hasError('required') && (readingForm.controls['label'].dirty || submitted)"  class="alert alert-info">Please pick a name for your first Reading Group!</div>
                        </label>
                    </div>

                    <!--Error and Success messaging-->
                    <p class="alert alert-warning" *ngIf="error.length > 0">{{ error }}</p>
                    <div class="alert alert-success alert-readings alert-dismissable" role="alert" *ngIf="showAlert">
                        <a href="#" class="close" (click)="showAlert=false">×</a>
                        {{ successObject.readingSuccess }}
                    </div>
                    <div class="alert alert-danger alert-readings" role="alert" *ngIf="errorObject.readingError">
                        {{ errorObject.readingError }}
                    </div>

                    <!--Show time last saved-->
                    <!--<div class="reading-time" *ngIf="reading._id && reading.updatedAt" [innerHtml]="showDate(reading.updatedAt)"></div>-->

                    <div class="button__row">
                        <button id="saveDraftButton" type="submit" class="btn btn-info btn_row" [class.loading]="addLoadingD" [class.disabled]="addLoadingP" title="Save as Draft">{{ reading._id && !reading.version_id ? 'Update Draft' : 'Save as Draft' }}</button>
                        <button id="addReadingButton" type="button" class="btn btn-primary btn_row" [class.loading]="addLoadingP" [class.disabled]="addLoadingD" title="Add Reading" (click)="this.isDraft=false;onSubmit(readingForm.value)">Publish</button>
                    </div>
                </div>
             </form>
        </div>
    </div>
</div>
<upload-picture-modal class="modal-will-fade" [class.show]="showUploadModal" (returnImage)="addImages($event)" (closeModal)="showUploadModal = false"></upload-picture-modal>
<upload-pdf-modal class="modal-will-fade" [class.show]="showPdfUploadModal" (returnImage)="addImages($event)" (closeModal)="showPdfUploadModal = false"></upload-pdf-modal>
