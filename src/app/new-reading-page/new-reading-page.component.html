<nav-bar [pageTitle]="reading._id ? 'Edit Reading' : 'New Reading'" [canPublish]="true" (saveAction)="saveReading($event, readingForm.value)" (shareAction)="shareReading($event, readingForm.value)"></nav-bar>

<div class="container">
    <div class="row">
        <div class="col-sm-12">
            <!--<h1>{{ reading._id ? 'Edit Reading' : 'New Reading' }}</h1>-->

             <form [formGroup]="readingForm" >
                <div class="reading-page">
                    <!--Error and Success messaging-->
                    <p class="alert alert-warning" *ngIf="error.length > 0">{{ error }}</p>
                    <div class="alert alert-success alert-readings alert-dismissable" role="alert" *ngIf="showAlert">
                        <a href="#" class="close" (click)="showAlert=false">×</a>
                        {{ successObject.readingSuccess }}
                    </div>
                    <div class="alert alert-danger alert-readings" role="alert" *ngIf="errorObject.readingError">
                        {{ errorObject.readingError }}
                    </div>

                    <div class="form-group">
                        <label>
                            <span>Title</span>
                            <input type="text" id="readingTitle" class="form-control h1 form-item--editor mTitle" placeholder="Reading Title..." [formControl]="readingForm.controls['title']"/>
                            <div id="errorTitle" *ngIf="readingForm.controls['title'].hasError('required') && (readingForm.controls['title'].dirty || submitted)"  class="alert alert-info">Please give your Reading a title!</div>
                        </label>
                    </div>
                    <div class="form-group medium-wrap" style="position:relative;">
                        <label>
                            <span>Reading Content</span>
                            <p class="sub-label">Select text to see formatting options. Use the insert buttons on the left to add images and PDFs.</p>
                            <medium-editor
                                [(editorModel)]="readingHtml"
                                [editorOptions]="mediumEditorConfig"
                                [editorPlaceholder]="readingPlaceholder"
                                (keyup)="contentChange($event)"
                                (mouseup)="contentChange($event)"
                                id="readingContent"
                                class="content"></medium-editor>
                            <div id="errorContent" *ngIf="submitted && readingIsBlank"  class="alert alert-info">Please give your Reading some text!</div>
                        </label>
                        <div class="editor-button-bar" [style.top]="editorToolbarY + 'px'">
                            <span class="editor-button-bar__title">Insert</span>
                            <a id="buttonUploadImage" class="btn btn-icon--plain" (click)="showUploadModal = true">
                                <img title="Add Picture" class src="/assets/images/icon-picture.svg" />
                            </a>
                            <a id="buttonUploadPdf" class="btn btn-icon--plain" (click)="showPdfUploadModal = true">
                                <img title="Add PDF" class src="/assets/images/icon-pdf.svg" />
                            </a>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>
                            Source
                            <p class="sub-label">(Optional) Provide a link or title for the source of the text.</p>
                            <div class="input-group">
                                <input type="text" id="readingSource" class="form-control form-item--editor h3 mSource" placeholder="New Reading Source..." [formControl]="readingForm.controls['source']" />
                            </div>
                        </label>
                    </div>
                </div>
             </form>
        </div>
    </div>
</div>
<upload-picture-modal class="modal-will-fade" [class.show]="showUploadModal" (returnImage)="addImages($event)" (closeModal)="showUploadModal = false"></upload-picture-modal>
<upload-pdf-modal class="modal-will-fade" [class.show]="showPdfUploadModal" (returnImage)="addImages($event)" (closeModal)="showPdfUploadModal = false"></upload-pdf-modal>
