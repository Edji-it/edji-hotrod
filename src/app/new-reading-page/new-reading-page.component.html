<side-bar></side-bar>

<div class="container container--side-bar">
    <div class="row">
        <div class="col-sm-12">
            <h1>New Reading</h1> 
             <form [formGroup]="readingForm" (ngSubmit)="onSubmit(readingForm.value)">
                <div  class="reading-page">
                    <div class="form-group offset-label">
                        <label class="border-wrap">
                            <span>Title</span>
                            <input type="text" id="readingTitle" class="form-control form-item--seamless h1 input-noborder" placeholder="Reading Title..." [formControl]="readingForm.controls['title']" />
                            <div *ngIf="readingForm.controls['title'].hasError('required') && (readingForm.controls['title'].dirty || submitted)"  class="alert alert-info">Please give your Reading a title!</div>
                        </label>
                    </div>
                    <div class="form-group offset-label">
                        <label class="border-wrap">
                            <span>Content</span>
                            <medium-editor
                                [(editorModel)]="readingHtml"
                                [editorOptions]="{'toolbar': {'buttons': ['bold', 'italic', 'underline', 'h1', 'h2', 'h3']}}"
                                [editorPlaceholder]="readingPlaceholder"
                                id="newReading"
                                class="content"></medium-editor>
                            <div *ngIf="submitted && readingHtml.length < 1"  class="alert alert-info">Please give your Reading some text!</div>
                        </label>
                    </div>
                    <div class="form-group offset-label">
                        <label class="border-wrap ">
                            <span title="Optionally link to where this Reading came from!">Link to Source
                            </span>
                            <div class="input-group">
                                <input type="url" id="readingSource" class="form-control form-item--seamless h3" placeholder="New Reading Source..." [formControl]="readingForm.controls['source']" />
                                <i class="input-group-tooltip icon__tooltip" placement="left" ngbTooltip="Keep a link to the source, so you don't lose it!'">
                                    <i class="icon icon-circle icon-info">i</i>
                                </i>
                            </div>
                        </label>
                    </div>
                    <p class="alert alert-warning" *ngIf="error.length > 0">{{ error }}</p>

                    <div class="button__row">   
                        <button id="addReadingButton" type="submit" class="btn btn-primary" [class.loading]="addLoading" name="Add">Add Reading</button>
                    </div>
                </div>
             </form>
        </div>
    </div>
</div>
