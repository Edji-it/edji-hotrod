<!-- Confirm Delete Mini Modal (6.17.17) -->
<div class="confirm-delete-mini-modal" id="confirmDelete">
  <div class="confirm-delete-dialog">
    <div class="modal-content">
      <div class="confirm-delete-header">
        <h4 class="confirm-delete-title">Are you sure you want to delete this PDF?</h4>
      </div>
      <div class="confirm-delete-body">
        <div>If you do, you won't be able to recover it.</div>
        <div class="btn-row" style="padding-top: 15px;">
          <button (click)="dismiss.emit()" type="button" class="btn">Cancel</button>
          <button id="pdfDelBtnConfirm" (click)="confirm.emit()" type="button" class="btn btn-primary">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
