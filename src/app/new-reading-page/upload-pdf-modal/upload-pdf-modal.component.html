<div id="uploadModal" class="modal">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form>   <!--(ngSubmit)=""-->
                <div class="modal-header">
                    <h4 class="modal-title">Upload a PDF</h4>
                    <button (click)="closeModal.emit()" type="button" class="close btn-icon--round" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!--<label class="custom-file">
                        <input type="file" id="file-input" class="file-input">
                        <span class="custom-file-control"></span>
                    </label>-->
                    <form>
                    <label class="btn btn-default btn-file">
                        Browse <input id="pdfFileInput" type="file" 
                            accept=".pdf"
                            (change)="updateUploadFile()"
                            style="display:none;">
                    </label>

                    <div class="file-name">
                        <span *ngIf="!this.file || !this.file.name || this.file.name.length < 1" class="placeholder">Select a PDF to upload...</span>
                        {{ this.file ? this.file.name : '' }}
                    </div>
                    
                    <button id="buttonBeginPdfUpload" (click)="beginUpload()" type="submit" class="btn btn-primary" 
                        [disabled]="noUploadAllowed"
                        [class.loading]="uploading">Upload</button>
                    </form>

                    <div *ngIf="errorMsg" class="alert alert-warning" [innerHtml]="errorMsg"></div>

                    <hr />
                    
                    <p id="status">Select a PDF to insert into your Reading</p>

                    <!--<div class="card-columns">-->
                        <div *ngFor="let doc of uploadedDocs; let i = index">
                            <!--Display doc pages if available-->
                            <div *ngIf="doc.pages && doc.pages[0]" class="card-group">
                                <div class="card title-card" (click)="insertPages(doc.pages)">
                                    <button class="btn btn-primary btn--center-overlay">Insert {{ doc.pages.length }} Page<span *ngIf="doc.pages.length > 1">s</span></button>
                                </div>
                                <div *ngFor="let url of doc.pages" (click)="insertImage(url)" class="card">
                                    <img class="card-img-top img-fluid" [src]="url" />
                                    <div class="card-img-overlay overlay-on-hover">
                                        <button class="btn btn-primary btn--center-overlay">Insert</button>
                                    </div>
                                </div>
                            </div>
                            <!--Display conversion message if doc isn't ready-->
                            <div *ngIf="doc.converted === false" class="card-group card-group--placeholder">
                                <div class="alert alert-info group-alert">
                                    <b>Document being converted</b><br/>
                                    Thank you for your patience! Some documents, especially those with many pages, can take several minutes.
                                </div>
                                <div class="card title-card">
                                    <button class="btn btn-primary btn--center-overlay" [disabled]="true">Insert X Pages</button>
                                </div>
                                <div class="card card-placeholder">
                                    <div class="card-img-top">&nbsp;</div>
                                </div>
                                <div class="card card-placeholder">
                                    <div class="card-img-top">&nbsp;</div>
                                </div>
                            </div>
                        </div>
                    <!--</div>-->
                </div>
                <div class="modal-footer">
                    <!--<button (click)="insertImage()" [disabled]="!uploadedUrls[0]" type="submit" class="btn btn-primary">Insert</button>
                    <button (click)="insertImage()" [disabled]="!uploadedUrls[0]" type="submit" class="btn btn-primary">Cancel</button>-->
                </div>
            </form>
        </div>
    </div>
</div>
