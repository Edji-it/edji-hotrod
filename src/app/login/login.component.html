<nav-bar></nav-bar>
<div class="gray">
  <div class="container-fluid">
    <div class="row navy-gradient has-sparks">
      <div class="sparks"></div>
      <div class="col-sm-3"></div>
      <div class="col-sm-6 col-pad on-dark">
        <h1 class="center on-dark">Access your Edji Dashboard</h1>
        <hot-login-form (loginSuccess)="loginSuccess()"></hot-login-form>
        <div style="text-align:center; margin: 1em 0;">
          <a id="linkForgotPassword" class="link open-modal" tabindex="0" (click)="showPassModal = !showPassModal">Forgotten password?</a>
        </div>
        <br />
        <hr>
        <br />
        <div class="button__row">
          <button id="buttonGoRegister" class="btn btn-secondary" name="Register" [routerLink]="['/register']" tabindex="0">Register</button>
        </div>
      </div>
    </div>
  </div>
</div>

<edji-reset-pass class="modal-will-fade" [class.show]="showPassModal" (closeModal)="showPassModal = !showPassModal"></edji-reset-pass>
