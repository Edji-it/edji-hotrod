<div id="deleteReadingModal" class="modal fade-in show">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Whoa there, partner!</h4>
                <button (click)="closeModal.emit()" type="button" class="close">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin: 0" [innerHtml]="'You are about to delete:<br><strong>' + reading.title + '</strong><br><br> If you do, it is gone forever, along with all of the associated groups. Are you sure?'"></p>
            </div>
            <div class="modal-footer">
                <div *ngIf="showError" class="alert alert-danger" role="alert">
                  <strong>Oh snap!</strong> Unable to delete Reading.
                </div>
              <div class="btn-row right">
                <button (click)="closeModal.emit()" type="button" class="btn" data-dismiss="modal">No</button><!--not sure what data-dismiss does-->
                <button (click)="closeModal.emit(); renewReadings.emit(reading._id); deleteThisReading(reading);" class="btn btn-primary">Yes, Delete It</button>
              </div>
            </div>
        </div>
    </div>
</div>
