<div id="addProjectModal" class="modal fade-in show">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">New Group</h4>
                <button (click)="closeModal.emit()" type="button" class="close">&times;</button>
            </div>
            <form [formGroup]="projectForm" (ngSubmit)="addProject(projectForm.value)">
              <div class="modal-body">
                  <div class="form-group">
                      <label for="newProjectLabel">Group Name</label>
                      <input tabindex="0" id="newProjectLabel" type="text" placeholder="What will you call the group?" [formControl]="projectForm.controls['label']" />
                      <div id="msgLabelRequired" *ngIf="formSubmitted && projectForm.controls['label'].hasError('required')" class="alert alert-warning" role="alert">Groups like to have names!</div>
                  </div>
                  <div class="form-group">
                    <label>Comment Types</label>
                    <p class="small" *ngIf="!canChooseTypes">
                        Unlock the power to choose comment types. <a class="link" href="/hero">Go Hero!</a>
                    </p>
                    <div class="input-group pl-3" [class.disabled]="!canChooseTypes">
                        <label class="custom-control custom-checkbox">
                            <input type="checkbox" [formControl]="projectForm.controls['emojiType']" class="custom-control-input">
                            <span class="custom-control-indicator"></span>
                            <span class="custom-control-description">Emoji Commenting</span>
                        </label> 
                    </div>
                    <div class="input-group pl-3" [class.disabled]="!canChooseTypes">
                        <label class="custom-control custom-checkbox">
                            <input type="checkbox" [formControl]="projectForm.controls['textType']" class="custom-control-input">
                            <span class="custom-control-indicator"></span>
                            <span class="custom-control-description">Text Commenting</span>
                        </label>
                    </div>
                    <!--jzk7|20170709 - make this disabled instead of hidden after we launch-->
                    <div class="input-group pl-3" [class.disabled]="!canChooseTypes">
                        <label class="custom-control custom-checkbox">
                            <input type="checkbox" [formControl]="projectForm.controls['audioType']" class="custom-control-input">
                            <span class="custom-control-indicator"></span>
                            <span class="custom-control-description">Audio Commenting <span class="hero-tag" title="Hero Power">H</span><span class="beta-tag">(BETA)</span></span>
                            <!--<p class="custom-control-description label--gray px-1">In Beta, may not work on all devices.</p>-->
                        </label>
                    </div>
                    <div class="input-group pl-3" [class.disabled]="!canChooseTypes">
                        <label class="custom-control custom-checkbox">
                            <input type="checkbox" [formControl]="projectForm.controls['replyType']" class="custom-control-input">
                            <span class="custom-control-indicator"></span>
                            <span class="custom-control-description">Comment Replies <span class="hero-tag" title="Hero Power">H</span></span>
                        </label>
                    </div>
                  </div>
                  <p *ngIf="commentTypes.indexOf('audio') > -1" class="label--gray"><span class="beta-tag">(BETA)</span>&nbsp;Beta features may not work on all devices.</p>
                  <!--</label>-->
                <div *ngIf="user.hero && user.hero.active" class="form-group">
                    <label for="customCodeInput">Custom Code
                        <input [formControl]="projectForm.controls['customCode']" id="customCodeInput" type="text" class="form-control form-item--editor h3 mGroup" placeholder="(optional)" style="text-transform:lowercase;"/>
                    </label>
                    <div *ngIf="errors.invalidCode" id="errorInvalidCustomCode" class="alert alert-warning">Whoops, someone is already using that group code. Could you pick another?</div>
                </div>
              </div>
              <div class="modal-footer">
                  <div class="button__row" style="padding-top:0px;">
                      <button id="buttonCreateGroup" tabindex="0" class="btn btn-primary" type="submit" [class.loading]="isLoading" name="Add Project" style="margin: 5px 3px; width:100%;">Create Group</button>
                  </div>
                  <div id="msgServiceError" *ngIf="formSubmitted && errors.serviceError" class="alert alert-warning" role="alert">Uh oh! We messed up and we don't know what to do!</div>
              </div>
            </form>
        </div>
    </div>
</div>
