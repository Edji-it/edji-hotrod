<div class="modal">
  <div class="modal-dialog" role="document">
    <div id="loginModal" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Log In</h5>
        <!--<button (click)="closeModal.emit()" type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>-->
      </div>
      <div class="modal-body">
        <div *ngIf="guestLogin">
          <h3 id="guestLoginHeader">Edji as a guest</h3>
          <hot-guest-login (loginSuccess)="onLoginSuccess()"></hot-guest-login>
        </div>
        <div *ngIf="!guestLogin">
          <!-- <div *ngIf="route.snapshot.queryParams['switch'] === 'google'" class="pb-2">
            <h3 id="oauthLoginHeader">Log in with Google</h3>
            <hot-google-button></hot-google-button>
          </div> -->
          <hot-oauth-row></hot-oauth-row>

          <h3 id="accountLoginHeader">Log in with an Edji account</h3>
          <hot-login-form (loginSuccess)="onLoginSuccess()"></hot-login-form>
          <br>
          
        </div>
      </div>
      <div *ngIf="guestLogin" class="modal-footer">
        <p class="center">Wait! I have an account and want to use it!</p>
        <div class="center">
          <button id="gotoAccountLoginButton" (click)="guestLogin = false">Login with Account</button>
        </div>
      </div>
      <div *ngIf="!guestLogin && !noGuestLogin" class="modal-footer">
        <p>Wait! I don't want to login, I just want to comment!</p>
        <div>
          <button id="gotoGuestLoginButton" (click)="guestLogin = true">Guest Login</button>
        </div>
      </div>
    </div>
  </div>
</div>
