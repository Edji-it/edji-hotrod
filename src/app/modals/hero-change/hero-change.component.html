<div id="upgradeHeroModal" class="modal fade-in" [class.hide]="tempHide">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Hero Subscription</h4>
                <button (click)="close()" type="button" class="close">&times;</button>
            </div>
            <div class="modal-body">
                <div *ngIf="!confirmCancel" class="row">
                    <div class="col-12">
                        <label>Hero Subscription Plan</label>
                        <table class="table table-hover">
                            <tbody>
                                <tr [class.table-info]="subtype == 'monthly'" (click)="subtype = 'monthly'" class="selectable">
                                    <th scope="row">
                                        <label class="form-check-label">
                                            <input [(ngModel)]="subtype" class="form-check-input" type="radio" name="subscriptionPlan" id="subPlan1" value="monthly" aria-label="Monthly Subscription">
                                            Monthly
                                        </label>
                                    </th>
                                    <td>
                                        <p>$5/mo</p>    
                                    </td>
                                    <td>
                                        <p>Billed as $5 every month</p>    
                                    </td>
                                </tr>
                                <tr [class.table-info]="subtype == 'yearly'" (click)="subtype = 'yearly'" class="selectable">
                                    <th scope="row">
                                        <label class="form-check-label">
                                            <input [(ngModel)]="subtype" class="form-check-input" type="radio" name="subscriptionPlan" id="subPlan2" value="yearly" aria-label="Annual Subscription">
                                            Yearly
                                        </label>
                                    </th>
                                    <td>
                                        <p>$4/mo</p>
                                    </td>
                                    <td>
                                        <p>Billed as $48 every year</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="alert alert-success" *ngIf="isUpdated">
                          <strong>Subscription Updated</strong> Your Hero Subscription was updated.
                        </div>
                        <div class="btn-row right">
                          <button [class.loading]="updating" id="subHero" (click)="updateType(subtype)" class="btn btn-primary">Update</button>
                        </div>
                        <hr>
                        <div class="btn-row right">
                          <button [class.loading]="canceling" id="subHero" (click)="confirmCancel = true" class="btn btn-secondary">Cancel Subscription</button>
                        </div>
                        <hr>
                    </div>
                </div>
                <div *ngIf="confirmCancel" class="row">
                    <div class="col-12">
                        <p>Please confirm that you would like unsubscribe from Edji Hero.</p>
                        <p>You will remain a Hero until the end of your current payment period.</p>
                        <div class="btn-row right">
                          <button [class.loading]="canceling" id="subHero" (click)="cancelSub()" class="btn btn-hero">Cancel Subscription</button>
                        </div>
                        <hr>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <!--<div class="alert alert-danger" role="alert">
                  <strong>Hero Subscription</strong> Couldn't process.
                </div>-->
              <!--<div *ngIf="!userNowHero" class="btn-row right">
                <button (click)="closeModal.emit()" type="button" class="btn" data-dismiss="modal">Cancel</button>
                <button [class.loading]="loading" id="subHero" (click)="checkout()" class="btn btn-primary">Update</button>
              </div>-->
              <div class="btn-row right">
                <button (click)="close()" type="button" class="btn" data-dismiss="modal">Close</button>
              </div>
            </div>
        </div>
    </div>
