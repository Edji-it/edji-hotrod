<div class="modal">
  <div class="modal-dialog" role="document">
    <div id="loginModal" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Log In</h5>
        <button (click)="closeModal.emit()" type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div>
          <h3 id="accountLoginHeader">{{ loginHeader }}</h3>
          <br/>
          <hot-login-form (loginSuccess)="loginSuccess.emit(); closeModal.emit()"></hot-login-form>
          <hr>
          <div class="button__row">
            <button class="btn btn-secondary" [routerLink]="['/register']">Register</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
