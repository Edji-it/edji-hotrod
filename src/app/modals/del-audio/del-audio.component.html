<div id="deleteAudioModal" class="modal fade-in show">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Record Over Your Audio Comment?</h4>
                <button (click)="closeModal.emit()" type="button" class="close">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin: 0" [innerHtml]="'You are about to delete your audio comment to record a new one. Are you sure?'"></p>
            </div>
            <div class="modal-footer">
                <div *ngIf="showError" class="alert alert-danger" role="alert">
                  <strong>Oh snap!</strong> Unable to delete the Audio file.
                </div>
              <div class="btn-row right">
                <button (click)="closeModal.emit()" type="button" class="btn" data-dismiss="modal">No</button><!--not sure what data-dismiss does-->
                <button (click)="delete.emit()" class="btn btn-primary">Yes</button>
              </div>
            </div>
        </div>
    </div>
</div>
