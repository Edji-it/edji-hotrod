<div id="licenseRemoveUser" class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Remove User</h4>
        <button (click)="closeAndReset()" type="button" class="close btn-icon--round">&times;</button>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <div class="form-group">
            <p *ngIf="userRemove.type === 'pending'">Are you sure you want to cancel the invite sent to {{ userRemove.email }}?</p>
            <p *ngIf="userRemove.type === 'active'">Are you sure you want to remove {{ userRemove.email }} from your organization?</p>
          </div>
        </div>
        <div [class.hide]="messages.success" class="modal-footer">
          <button (click)="closeAndReset()" type="button" class="btn" data-dismiss="modal">Cancel</button>
          <button *ngIf="userRemove.type === 'active'" type="submit" class="btn btn-primary" [class.loading]="loading">
            Remove
          </button>
          <button *ngIf="userRemove.type === 'pending'" type="submit" class="btn btn-primary" [class.loading]="loading">
            Cancel Invite
          </button>
        </div>
        <div *ngIf="messages.success || messages.serviceError" class="modal-footer">
          <div id="msgServiceError" class="alert alert-danger" *ngIf="messages.serviceError">
            We encountered an error while removing {{ userRemove.email }} from the academy. Please try again or contact support.
          </div>
          <div id="msgServiceSuccess" class="alert alert-success" *ngIf="messages.success">
            User removed!
            <button (click)="closeAndReset()" type="button" class="btn ml-2" data-dismiss="modal">Close</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
