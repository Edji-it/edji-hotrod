<div *ngIf="(!isCompleted && !forceCollapse) || expand" class="right-margin-tooltip">
  <div class="mobile-toggle" (tap)="mobileExpanded = !mobileExpanded">
    <i class="icon-caret" [class.down]="mobileExpanded"></i>
    <h2 [innerHtml]="pageObjs && pageObjs[pageNo - 1].title | emojione"></h2>
    <quick-start-flag></quick-start-flag>
  </div>
  <div *ngIf="pageObjs" class="collapsible" [class.mobile-collapse]="!mobileExpanded">
    <p [innerHtml]="pageObjs[pageNo - 1].body"></p>
    <img
      *ngIf="pageObjs[pageNo - 1] && pageObjs[pageNo - 1].image"
      [src]="pageObjs[pageNo - 1].image"
      class="tooltip__guide-image"
    />
    <div *ngIf="pageNo == pageObjs.length" class="btn-row">
      <button class="btn btn-success" (click)="completeAndDismiss()">Got it!</button>
    </div>
    <div *ngIf="pageObjs.length > 1" class="tooltip-pager">
      <div (click)="decrement()" [class.disabled]="pageNo < 2" class="tooltip-pager__left">&larr;</div>
      <div class="tooltip-pager__dot-wrap">
        <div
          *ngFor="let page of pageObjs; let i = index"
          class="tooltip-pager__dot"
          [class.active]="i == pageNo - 1"
          (click)="pageNo = i + 1"
        ></div>
      </div>
      <div (click)="increment()" [class.disabled]="pageNo >= pageObjs.length" class="tooltip-pager__right">&rarr;</div>
    </div>
    <div class="tooltip__skip" (click)="completeAndDismiss()">Skip</div>
  </div>
</div>
<quick-start-flag *ngIf="(isCompleted || forceCollapse) && !expand" [isCornerTrigger]="true" (click)="openTutorial()"></quick-start-flag>
