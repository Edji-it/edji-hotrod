<div class="side-bar__wrap">
	<div id="sideBar" class="side-bar">
		<!--<a class="logo-button" href="#/dashboard">
			<img id="logomark" src="assets/images/logo-mark.svg" />
			<img id="logo" src="assets/images/logo.svg" />
			<img id="logoPressed" src="assets/images/logo-pressed.svg" />
		</a>-->
		<a [routerLink]="['/dashboard']">
			<img id="logo" class="side-bar__logo" src="assets/images/logo-3.2-mark.svg" />
			<!--<img id="logoPressed" src="assets/images/logo-pressed.svg" />-->
		</a>

		<!--Comment Stats pane-->
		<button *ngIf="user.isTeacher && hasCommentCount" type="button" class="btn btn-clear side-bar__icon-button" aria-label="Comment Counts" (click)="showCommentCounts = !showCommentCounts">
			<img src="assets/images/icon-comment.svg" />
			<span>{{ commentStats ? commentStats.count : 0 }}</span>
		</button>
		<div class="sliding-pane mid-bar from-left" [ngClass]="{ 'slide-in' : showCommentCounts }">
			<div class="container-fluid">
				<h4>
				<i class="fa fa-chevron-left btn-icon"></i>
				{{ commentStats && commentStats.users ? commentStats.users.length : 0 }} Students
				</h4> 
				<div class="user-list-item" style="opacity: 0.3; margin-bottom: 14px;">
				<span>Username</span> 
				<b style="float:right;">Comments</b>
				</div>
				<div *ngFor="let commentUser of commentStats.users" class="user-list-item">
					<span>{{ commentUser.name }}</span> 
					<b style="float:right;">{{ commentUser.count }}</b>
				</div>
			</div>
		</div>

		<div class="side-bar__user">
			<a class="side-bar__link" id="accountButton" [routerLink]="['/account']">
				<span *ngIf="user.fullname">{{ user.fullname }}</span>
				<span *ngIf="!user.fullname">{{ user.username }}</span>
			</a>
			
			<span class="side-bar__role" *ngIf="user">{{  user.isTeacher ? "Teacher" : "Student"  }}</span>
			&nbsp;
			<a class="side-bar__link" (click)="logout()">
				Logout &nbsp;
				<img alt="🏃" class="emojioneemoji" src="https://cdnjs.cloudflare.com/ajax/libs/emojione/2.1.4/assets/png/1f3c3.png">
			</a>
		</div>
	</div>
</div>
