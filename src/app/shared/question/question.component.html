<div class="question-container row">
  <!-- Question Number
      - Everything is spaced to the right of this.
  -->
  <div class="number-container">
    <div class="question-number">3</div>
  </div>
  <!-- Question Body - aka Everything else -->
  <div class="question-body">
    <!-- The Question Prompt Section -->
    <div class="prompt-section">
      <label class="question-label">QUESTION</label>
      <div class="prompt">{{tempQuestion.prompt}}</div>
    </div>
    <!-- Answers Section -->
    <div class="answers-section">
      <label class="answer-label">ANSWERS</label>
      <!-- The Answers.
        - If the user has answered, they can see the other answers.
        - Otherwise, give them options to answer.
      -->
      <div class="answers-block">
        <div class="answer-options">
          <!-- Emoji Answer Button -->
          <button class="btn">Emoji</button>
          <!-- Text Answer Button -->
          <button class="btn">Text</button>
        </div>
        <div class="answer-list">Answers are listed here.</div>
      </div>
    </div>
  </div>
</div>
