  Question template
  29 July 17
  Nick Pumper
  Last Mod: 8 Aug 2017
-->
<div class="question-container row" id="{{ question._id }}"
  [ngClass]="[editor ? 'question-container__new' : 'question-container__existing']">
  <!-- Question Number
      - Everything is spaced to the right of this.
  -->
  <div id="question-{{ question.question_number }}" [ngClass]="[editor ? 'question-container__inner' : '']">
    <div class="number-container">
      <div class="question-number">{{ question.question_number }}</div>
    </div>
    <!-- Question Body - aka Everything else -->
    <div class="question-body" [ngClass]="[editor ? 'question-body__new' : '']">
      <!-- The Question Prompt Section -->
      <div class="prompt-section" [ngClass]="[editor ? 'prompt-section__new' : '']">
        <label class="label--gray all-caps">Question</label>
        <div *ngIf="question && !editor" class="prompt">{{ question.prompt }}</div>
        <textarea *ngIf="question && editor" type="text" placeholder="Question text..."
          class="text-comment-input question-input" [(ngModel)]="question.prompt"
          (change)="questionUpdate.emit(question)" (keyup)="textAreaAdjust($event, promptAutoSize)"
          (mousedown)="$event.stopPropagation()"></textarea>
        <div #promptAutoSize class="text-comment-input question-input"
          style="opacity: 0; pointer-events: none; position: absolute; height:auto; width:auto"
          [innerHtml]="question.prompt"></div>
        <div class="alert alert-warning" *ngIf="question && editor && question.prompt.length < 1">
          Don't forget to ask your question!
        </div>
      </div>

      <!-- Answer and Options Section | If the teacher is creating a question on the new reading page -->
      <div *ngIf="editor">
        <div class="label--gray all-caps">Answer Types</div>
        <div class="answer-options" id="answerOptions">
          <!-- Answer Buttons -->
          <button *ngFor="let type of answerTypesAvailable" id="commentOption" class="button__answer-type"
            [ngClass]="[type, question.answer_types.indexOf(type) > -1 ? 'answer--enabled' : '']"
            (tap)="toggleAnswerOfType(type)">
            <i class="icon icon-comment-{{ type }} icon__answer-type"></i>
            <div class="icon__answer-text">{{ type }}</div>
          </button>
        </div>
        <div class="alert alert-warning" *ngIf="question.answer_types.length < 0">
          Please choose which Answer Types you would like your readers to respond with.
        </div>
        <div *ngIf="questionOptionsStatus">
          <div id="answerOptions_block" class="label--gray all-caps">Options</div>
          <div class="answer-options">
            <button *ngFor="let type of optionTypesAvailable" id="selectOption" class="button__answer-type"
              [ngClass]="[optionTypeStatus[type.type] ? 'answer--enabled' : '']" (tap)="enableOptionOfType(type.type)"
              style="padding: 2px 6px;">
              <div class="icon__answer-text">{{ type.text }}</div>
            </button>
          </div>
          <!--<i class="icon icon-{{type.type}}-comment icon__answer-type"></i>-->
        </div>
      </div>
      <div *ngIf="!editor && !readOnly">
        <!-- Answer Input  -->
        <div *ngIf="!hasUserAnswered()">
          <open-ended-answers *ngIf="[responseType === 0]" [baseQuestionReference]="question"
            [enabledAnswerTypes]="question.answer_types" id="openEndedAnswers"></open-ended-answers>
        </div>

        <div *ngIf="answersById[question._id] && answersById[question._id].length > 0">
          <div class="label--gray">
            ANSWERS
            <!--<span *ngIf="!hasUserAnswered()" style="font-weight:normal;display:block;margin-top:-1em;">(Answer to see other readers' answers)</span>-->
            <button class="button-answers__hide btn btn-sm btn-gray" (click)="ownerHidden = !ownerHidden"
              [class.hidden]="user._id !== project.teacher_id">
              {{ ownerHidden ? 'SHOW' : 'HIDE' }}
            </button>
          </div>
        </div>
        <div class="answerOverflow answerOverflow-normal" id="answerBlock" *ngIf="!ownerHidden">
          <div *ngFor="let answer of answersById[question._id]; let i = index">
            <div *ngIf="isAnswerVisible(answer)" class="comment-wrap-row">
              <edji-comment class="answerCommentBlock" [comment]="answer" [commentContext]="'answer'"
                [isActive]="answer.active" [reply]="true"></edji-comment>
            </div>
          </div>
        </div>
      </div>
      <button *ngIf="question && editor" (tap)="questionDelete.emit()" class="inline-delete question-delete">
        +
      </button>
    </div>
  </div>
</div>
