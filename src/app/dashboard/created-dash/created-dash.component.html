<!--Teacher View-->
<loading-component></loading-component>
<div class="row hidden-sm-down">
    <div class="col-sm-6">
        <h1 class="no-flow">Created
            <i class="icon__tooltip" placement="bottom" ngbTooltip="Readings are how you share content on Edji!">
                <span class="icon icon-circle icon-info">i</span>
            </i>
        </h1>
    </div>
    <div class="col-sm-6">
        <button *ngIf="user.type == 'temp'" class="btn btn-primary new-reading-btn" (click)="showLoginReqModal = true">
            New Reading
        </button>
        <button *ngIf="user.type != 'temp'" class="btn btn-primary new-reading-btn" [routerLink]="['/new-reading']">
            New Reading
        </button>
    </div>
</div>

<div *ngIf="isLoading" class="row loading"></div>
<button class="btn btn-primary new-reading-btn hidden-md-up" [routerLink]="[ '/new-reading' ]">
    New Reading
</button>
<!-- Our Readings! -->
<div class="item-list">
    <!--Show readings with date values-->
    <div class="alert alert-info" role="alert" *ngIf="!isLoading && readings.length < 1 && !errorObject.readingError">
        <h4 class="alert-heading">Share some text or something you wrote!</h4>
        <p>Readings are a great way to explore a piece of text together, or get feedback on your own writing.</p>
        <!--<p [innerHtml]="'Those you create will show here, with the :zap: code for quickly sharing it with someone else.' | emojione"></p>-->
    </div>
    <div class="alert alert-danger alert-readings" role="alert" *ngIf="errorObject.readingError">
        {{ errorObject.readingError }}
    </div>
    <hot-reading-card *ngFor="let reading of readings" style="margin-bottom: 30px; float:left; width:100%;" [reading]="reading"></hot-reading-card>
    <hot-tutorial-reading *ngIf="!isLoading && readings.length < 1 && !errorObject.readingError && user.type !=='temp'"></hot-tutorial-reading>
</div>

<hot-login-req *ngIf="showLoginReqModal" (closeModal)="showLoginReqModal = false"></hot-login-req>
