<div class="dashboard-toolbar">
    <a class="tab-2 h1" (click)="mobileShowJoined=true" [class.active]="mobileShowJoined">Joined</a>
    <a class="tab-2 h1" (click)="mobileShowJoined=false" [class.active]="!mobileShowJoined">Created</a>
</div>
<!--Dashboard uses the *fluid* container, for maximum space use-->
<div class="container-fluid dashboard-container">
    <div class="row">
        <div [class.mnHide]="!mobileShowJoined" class="col-md-6 pb-5 large-gutter dashboard__container--iPadwidth">
            <edji-joined-dash></edji-joined-dash>
        </div>
        <div [class.mnHide]="mobileShowJoined" class="col-md-6 large-gutter mnActive dashboard__container--iPadwidth">
            <edji-created-dash></edji-created-dash>
        </div>
    </div>
</div>

<div class="fixed-btn-row--SE ">
    <!-- TooltTips (added 6.8.17) -->
    <tutorial-box class="hidden-sm-down" [tutorialName]="'newReading'"
        [pageObjs]="toolTipsContent" 
        [pager]="toolTipStepNo" 
        (pageChange)="toolTipStepNo = $event">
    </tutorial-box>
    <edji-feedback></edji-feedback>
</div>
<hot-user-details-update *ngIf="showUserDetailsModal" [showModal]="showUserDetailsModal" (closeModal)="showUserDetailsModal = false"></hot-user-details-update>
