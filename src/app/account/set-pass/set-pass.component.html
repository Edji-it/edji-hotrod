<div id="setPasswordModal" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Set Password</h4>
          <button (click)="closeAndReset()" type="button" class="close btn-icon--round">&times;</button>
        </div>
        <form (ngSubmit)="onSubmit(passwordForm.value)" [formGroup]="passwordForm">
          <div class="modal-body">
            <div class="form-group">
              <label for="new-password-input">New Password</label>
              <input
                type="password"
                id="new-password-input"
                class="form-control"
                [formControl]="passwordForm.controls['new_password']"
              />
              <div
                *ngIf="
                  passwordForm.controls['new_password'].hasError('required') && passwordForm.controls['new_password'].dirty
                "
                class="alert alert-info"
              >
                A new password is required
              </div>
              <div
                *ngIf="
                  passwordForm.controls['new_password'].hasError('minlength') && passwordForm.controls['new_password'].dirty
                "
                class="alert alert-warning"
              >
                Passwords must have at least 6 characters
              </div>
              <label for="new-password-confirm-input">Confirm New Password</label>
              <input
                type="password"
                id="new-password-confirm-input"
                class="form-control"
                [formControl]="passwordForm.controls['newPasswordConfirm']"
              />
              <div
                *ngIf="
                  passwordForm.controls['newPasswordConfirm'].hasError('required') &&
                  passwordForm.controls['newPasswordConfirm'].dirty
                "
                class="alert alert-info"
              >
                Please confirm your new password
              </div>
              <div *ngIf="passwordForm.hasError('mismatch')" class="alert alert-info">
                Please make sure your passwords match
              </div>
            </div>
          </div>
          <div [class.hide]="messages.success" class="modal-footer">
            <button (click)="closeAndReset()" type="button" class="btn" data-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" [class.loading]="loading" [disabled]="!passwordForm.valid">
              Set Password
            </button>
          </div>
          <div *ngIf="messages.success || messages.serviceError" class="modal-footer">
            <div id="msgServiceError" class="alert alert-danger" *ngIf="messages.serviceError">
              We encountered an error while setting your password. Please try again or contact support.
            </div>
            <div id="msgServiceSuccess" class="alert alert-success" *ngIf="messages.success">
              Way to go, you set your password!
              <button (click)="closeAndReset()" type="button" class="btn ml-2" data-dismiss="modal">Close</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
