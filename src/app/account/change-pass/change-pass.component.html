<div id="passwordModal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Reset Password</h4>
                <button (click)="closeModal.emit()" type="button" class="close btn-icon--round">&times;</button>
            </div>
            <form (ngSubmit)="onSubmit(passwordForm.value)" [formGroup]="passwordForm">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="old-password-input">Old Password</label>
                        <input type="password" id="old-password-input" class="form-control" [formControl]="passwordForm.controls['oldPassword']" />
                        <div *ngIf="passwordForm.controls['oldPassword'].hasError('required') && passwordForm.controls['oldPassword'].dirty" class="alert alert-info">You must have a password</div>

                        <label for="new-password-input">New Password</label>
                        <input type="password" id="new-password-input" class="form-control" [formControl]="passwordForm.controls['newPassword']" />
                        <div *ngIf="passwordForm.controls['newPassword'].hasError('required') && passwordForm.controls['newPassword'].dirty" class="alert alert-info">A new password is required</div>
                        <div *ngIf="passwordForm.controls['newPassword'].hasError('minlength') && passwordForm.controls['newPassword'].dirty" class="alert alert-warning">Passwords must have at least 6 characters</div>

                        <label for="new-password-confirm-input">New Confirm New Password</label>
                        <input type="password" id="new-password-confirm-input" class="form-control" [formControl]="passwordForm.controls['newPasswordConfirm']" />
                        <div *ngIf="passwordForm.controls['newPasswordConfirm'].hasError('required')  && passwordForm.controls['newPasswordConfirm'].dirty" class="alert alert-info">Please confirm your new password</div>
                        <div *ngIf="passwordForm.hasError('mismatch')" class="alert alert-info">Please make sure your passwords match</div>
                    </div>
                </div>
                <div [class.hide]="messages.success" class="modal-footer">
                    <button (click)="closeModal.emit()" type="button" class="btn" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" [class.loading]="loading" [disabled]="!passwordForm.valid">Reset Password</button>
                </div>
                <div *ngIf="messages.success" class="modal-footer">
                    <div class="alert alert-success">Way to go, you reset your password!
                        <button (click)="closeModal.emit()" type="button" class="btn ml-2" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
