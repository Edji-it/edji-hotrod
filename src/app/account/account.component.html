<nav-bar></nav-bar>

<div class="container">
  <div class="row">
      <div class="col-sm-2"></div>
      <div class="col-sm-8">
          <h1>Account Details</h1>

          <div class="card">
            <div class="card-block">
                <div class="form-group row">
                    <label class="col-sm-4 col-form-label">Name</label>
                    <div class="col-sm-8">
                        <p class="form-control-static">{{currentUser.fullname}}</p>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="inputPassword" class="col-sm-4 col-form-label">Username</label>
                    <div class="col-sm-8">
                        <p class="form-control-static">{{currentUser.username}}</p>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="inputPassword" class="col-sm-4 col-form-label">Email</label>
                    <div class="col-sm-8">
                        <p class="form-control-static">{{currentUser.email}}</p>
                    </div>
                </div>
            </div><!--card-block-->
          </div>
          <div class="card text-center">
                <div class="card-block">
                    <button type="button" (click)="showPassModal = !showPassModal" class="btn btn-primary">Change Password</button>
                </div>
          </div>
      </div>
      <div class="col-sm-2"></div>
  </div>
</div>
<edji-change-pass class="modal-will-fade" [class.show]="showPassModal" (closeModal)="showPassModal = !showPassModal"></edji-change-pass>
