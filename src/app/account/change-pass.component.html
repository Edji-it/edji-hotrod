<div id="passwordModal" class="modal fade fade-in">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <!--<button (click)="hidden = true" type="button" class="close">&times;</button>-->
                <h4 class="modal-title">Reset Password</h4>
            </div>
            <form class="modal-body form-group" (ngSubmit)="onSubmit(passwordForm.value)" [formGroup]="passwordForm">
                <label for="old-password-input">Old Password</label>
                <input type="password" id="old-password-input" class="form-control" [formControl]="passwordForm.controls['oldPassword']" />
                <div *ngIf="passwordForm.controls['oldPassword'].hasError('required') && passwordForm.submitted" class="banner-error">You must have a password!</div>

                <label for="new-password-input">New Password</label>
                <input type="password" id="new-password-input" class="form-control" [formControl]="passwordForm.controls['newPassword']" />
                <div *ngIf="passwordForm.controls['newPassword'].hasError('required') && passwordForm.submitted" class="banner-error">A new password is required!</div>
                
                <label for="new-password-confirm-input">New Confirm New Password</label>
                <input type="password" id="new-password-confirm-input" class="form-control" [formControl]="passwordForm.controls['newPasswordConfirm']" />
                <div *ngIf="passwordForm.controls['newPasswordConfirm'].hasError('required') && passwordForm.submitted" class="banner-error">Please confirm your new password!</div>
                <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.submitted" class="banner-error">Please make sure your passwords match!</div>
                
                <!--<div class="banner-error" ng-if="!passwordModal.sent && errorObject.failed" ng-bind="errorObject.failed"></div>
                <div class="banner-success" ng-if="passwordModal.sent && passwordModal.success" ng-bind="passwordModal.success"></div>-->
                <div class="modal-footer">
                    <!--<button ng-click="hidePasswordModal()" type="button" class="btn" data-dismiss="modal">Close</button>-->
                    <button type="submit" class="btn btn-primary" [disabled]="!passwordForm.valid">Reset Password</button>
                </div>
            </form>
            
        </div>
    </div>
</div>
