<!--Desktop Comment Rendering-->
<div class="comment" [class.new]="comment.new" [class.saved]="justSaved" [class.active]="active" 
    [class.readonly]="readOnly" [ngClass]="[ expanded ? 'expanded' : '', active ? 'comment__show' : '', reply ? 'replyComment' : 'hidden-md-down line-count-' + lineCount ]">
    <div *ngIf="!commentLite" class='expand-comments' (tap)='expanded ? collapse() : expand()' [ngClass]="comment.type == 'emoji' ? 'cmtEmoji' : 'cmtText'">
        <div *ngIf="lineCount == 1 && expanded" class='hidden-lg-up expand__arrow-left'></div>
    </div>
    <!-- Author Name Label -->
    <div *ngIf='comment.author && !commentLite' [ngClass]="[ reply ? 'replyUsername' : '' ]" class='comment-username'>{{comment.author}}
        <span *ngIf="reply && replyRef" class="comment__time text-right">&nbsp;{{ comment.createdAt | edjidate:'timeAgo':null:secondsAgo }}</span>
        <span *ngIf="reply && !replyRef" class="comment__time text-right">&nbsp;{{ comment.updatedAt | edjidate:'timeAgo':null:secondsAgo }}</span>
    </div>
    <!-- Avatar -->
    <div *ngIf="comment.author" [class.show]="comment.showAvatar || reply" class="comment__avatar">{{comment.author.substr(0,2).toUpperCase()}}</div>
    <!-- Input Box -->
    <div class='comment-input-wrapper' [ngClass]="[ replyRef ? 'replyCommentHandler' : '' ]">
        <!--Swap between different comment types-->
        <emoji-comment (tap)="toggleActive()" *ngIf="comment.type == 'emoji' || !comment.type" #commentInput [comment]="comment" [reply]="reply"></emoji-comment>
        <text-comment (tap)="activate()" [readOnly]="readOnly" [preview]="preview || active" *ngIf="comment.type == 'text'" [comment]="comment" #commentInput (blur)="deactivate()" 
            [active]="comment.active" [reply]="reply"></text-comment>
        <audio-comment (tap)="activate()" *ngIf="comment.type == 'audio'" [comment]="comment" #commentInput (save)="deactivate($event)" [active]="comment.active" 
            [recordNewAudio]="reRecordAudio" (showDeleteAudioModal)="showDeleteAudioModal = true" [userPermission]="userPermission" [reply]="reply"></audio-comment>
        <button *ngIf="userPermission >= 3" (tap)="userPermission > 3 ? deleteComment(comment) : showDeleteModal = true" class='inline-delete'>+</button>
        <div *ngIf="!reply && project.types.indexOf('reply') > -1" class="reply" id="addReply" (click)="commentReply.emit()">
            <p class="text-left reply-text-left">Reply</p>
            <span class="text-right ">
                <p class="reply-text-right">{{ repliesById[comment._id] && repliesById[comment._id].length }}</p>
                <img class="reply-icon" src="assets/images/icon-comment-white.svg"/>
            </span>
        </div>
    </div>
    <div *ngIf="comment.active" class="comment__save" (tap)="deactivate()" [innerHtml]="':white_check_mark:' | emojione"></div>
    <i class="comment__saved" [innerHtml]='":ok_hand:" | emojione'></i>
</div>

<!--Mobile icon-->
<img (tap)='expanded ? collapse($event) : expand($event)' class="comment__button--mobile" src="assets/images/icon-comment.svg" [ngClass]="[ reply ? 'icon-hidden' : 'hidden-lg-up']" />
<hot-del-comment *ngIf="showDeleteModal" [comment]="comment" (delete)="deleteComment(comment)" (closeModal)="showDeleteModal = false; commentDeactivate.emit(comment)"></hot-del-comment>
<hot-del-audio *ngIf="showDeleteAudioModal" [comment]="comment" (delete)="reRecordAudio = true; showDeleteAudioModal = false" (closeModal)="showDeleteAudioModal = false"></hot-del-audio>
