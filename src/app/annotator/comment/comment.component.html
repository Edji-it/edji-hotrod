<div class="comment" [class.saved]="justSaved" [class.active]="active"  [ngClass]="[ 'line-count-' + lineCount, expanded ? 'expanded' : '' ]" (mouseenter)='focusComment(comment.start, comment.end)' (mouseleave)='unfocusComment(comment.start, comment.end)'>
    <div class='expand-comments' (click)='toggleExpand($event)'></div>
    <div class='comment-username'>{{comment.author}}</div>
    <div (click)="toggleActive()" class='comment-input-wrapper'>
        <!--Swap between different comment types-->
        <emoji-comment *ngIf="comment.type == 'emoji' || !comment.type" #commentInput [comment]="comment"></emoji-comment>
        <!--<text-comment *ngIf="comment.type == 'text'" [comment]="comment" #commentInput (onCommentUpdate)="updateComment(comment.data)"></text-comment>-->
        <button (click)="deleteComment(comment._id)" class='inline-delete'>+</button>
    </div>
    <i class="comment__saved" [innerHtml]='":ok_hand:" | emojione'></i>
</div>
