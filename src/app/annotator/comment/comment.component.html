<div [ngClass]="{ 'saved' : justSaved }" (mouseenter)='focusComment(comment.start, comment.end)' (mouseleave)='unfocusComment(comment.start, comment.end)'>
    <div class='expand-comments' (click)='toggleExpand($event)'></div>
    <div class='emoji-comment-username'>{{comment.author}}</div>
    <div (click)="toggleActive()" class='emoji-comment-input-wrapper'>
        <!--Swap between different comment types-->
        <emoji-comment [comment]="comment" (onCommentUpdate)='updateComment($event)'></emoji-comment>
        <button (click)="deleteComment(comment._id)" class='inline-delete'>+</button>
    </div>
    <i class="emoji-comment__saved" [innerHtml]='":ok_hand:" | emojione'></i>
</div>
