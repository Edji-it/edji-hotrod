<div (mouseenter)='focusComment(comment.start, comment.end)' (mouseleave)='unfocusComment(comment.start, comment.end)'>
    <div class='expand-comments' (click)='toggleExpand($event)'></div>
    <div class='emoji-comment-username'>{{comment.author}}</div>
    <div class='emoji-comment-input-wrapper'>
        <emoji-comment [comment]="comment"></emoji-comment>
        <button class='inline-delete'>+</button>
    </div>
</div>
