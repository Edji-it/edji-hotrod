<div [ngClass]="{'active' : comment.active || preview }" class='text-comment input-wrap'>
    <textarea autosize type='text' class="text-comment-input" [disabled]="readOnly" [(ngModel)]="comment.data" (blur)='updateComment(comment.data)' (keydown.enter)='blurField($event)' (keyup.esc)='blurField($event)' maxlength="140"></textarea>
    <div class="text-comment__countdown" [class.hidden]="comment.active !== true" [class.danger]="comment.data.length > 120">{{ -1*(140 - comment.data.length) }}</div>
</div>
