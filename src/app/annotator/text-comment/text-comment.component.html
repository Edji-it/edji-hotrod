<div [ngClass]="{'active' : comment.active || preview }" class='text-comment input-wrap'>
    <!--Comment Input-->
    <textarea *ngIf="!readOnly && comment.active" type='text' placeholder="Text comment..." class="text-comment-input" [class.disabled]="readOnly" [(ngModel)]="comment.data" (blur)='updateComment(comment.data)' (keydown.enter)='blurField($event)' (keyup.esc)='blurField($event)' maxlength="140"></textarea>
    <!--Comment Display-->
    <div *ngIf="readOnly || !comment.active" [class.disabled]="!preview" class="text-comment-input" [innerHtml]="comment.data | linkify"></div>

    <div class="text-comment__countdown" [class.hidden]="comment.active !== true" [class.danger]="comment.data.length > 120">{{ -1*(140 - comment.data.length) }}</div>
</div>
