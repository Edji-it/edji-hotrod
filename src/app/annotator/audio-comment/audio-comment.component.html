<div [ngClass]="{'active' : comment.active}" class='audio-comment-input-wrapper input-wrap'>
    <button style="margin-left: 2px;" class="btn-audio">
        <i [class.hide]="isPlaying" class="icon-play" (click)="play()"></i>
        <i [class.hide]="!isPlaying" class="icon-pause" (click)="pause()"></i>
    </button>
    <button class="btn-audio" (click)="isRecording=false; isPlaying=false; pause()"><i class="icon-restart"></i></button>
    <!--<canvas class="wave-form" id="{{comment._id}}"></canvas>-->
    <canvas class="wave-form" id="0001"></canvas>
    <div [ngClass]="[ isPlaying ? 'playing' : '' ]" [style.width]="playTime"></div>
    <div [ngClass]="[ isRecording ? 'recording' : '' ]" [style.width]="playTime"></div>
    <button class="btn-audio btn-record" (click)="isRecording ? stopRecord() : record()"><i class="icon icon-mic"></i></button>
</div>
