<div [ngClass]="[comment.active ? 'active' : '', reply ? 'reply-audio-wrapper' : '']" class='audio-comment-input-wrapper input-wrap'>
    <div class="audio-btn-wrap" [class.fade-out]="!comment.active">
        <button class="btn-audio" [class.disabled]="!playAble">
            <i id="audioPlay" [class.hide]="isPlaying" class="icon-play" (click)="play()"></i>
            <i id="audioPause" [class.hide]="!isPlaying" class="icon-pause" (click)="pause()"></i>
        </button>
        <button id="audioRestart" class="btn-audio" [class.disabled]="!playAble" (click)="isRecording=false; isPlaying=false; restartPlayback()"><i class="icon-restart"></i></button>
        <button id="audioRecord" [class.hide]="userPermission <= 3" class="btn-audio btn-record" (click)="isRecording ? stopRecord() : record()" [class.disabled]="!recordAble"><i class="icon icon-mic"></i></button>
    </div>
    <div [ngClass]="[reply ? 'reply-wave' : '']" class="wave-wrap" [style.width]="playWidth + 'px'">
        <canvas (click)="setPlaybackTime($event)"  class="wave-form"></canvas>
        <div class="countdown" *ngIf="countdown" [innerHtml]="countdownText[countdownI]"></div>
        <div *ngIf="audio && isPlaying" [class.hide]="!comment.active && (isRecording || !audio.currentTime)" class="playing" [style.width]="getPlayhead() + 'px'"></div>
        <div *ngIf="audio && !isPlaying" [class.hide]="!comment.active && (isRecording || !audio.currentTime)" class="playing" [style.width]="pausedWidth + 'px'"></div>
        <!--<div [class.hide]="!comment.active && (isRecording || !audio || !audio.currentTime)" class="playing" [style.width]="getPlayhead() + '%'"></div>-->
    </div>
</div>
