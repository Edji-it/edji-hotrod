<div [ngClass]="[comment.active ? 'active' : '', reply ? 'replyDisplay' : '']" class='emoji-comment-input-wrapper emojionearea input-wrap'>
    <!--<textarea type='text' class='emojiComment' readonly='true'></textarea>-->
    <div *ngIf="comment.data.length > 0" 
        id="emojiCommentInput"
        class="emoji-comment-input" 
        [innerHtml]="comment.data | emojione"
    ></div>
    <span *ngIf="comment.data.length < 1" class="emoji-comment-placeholder">Emoji comment...</span>
</div>
