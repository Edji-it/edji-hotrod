<div id="emojiAnnotator" [ngClass]="{ 'comment-expanded' : lineExpanded }">
    <div *ngIf="showAllComments" class="sliding-pane mid-bar from-left" [ngClass]="{ 'slide-in' : showCommentCounts }">
        <div class="container-fluid">
			<!--<h4>
				<i class="fa fa-chevron-left btn-icon" ng-click="toggleCommentCounts()"></i>
				{{ studentCount() }} Students
			</h4> 
			<div class="user-list-item" style="opacity: 0.3; margin-bottom: 14px;">
				<span>Username</span> 
				<b style="float:right;">Comments</b>
			</div>
			<div class="user-list-item" ng-repeat="comments in commentsByUser | orderObjectBy:'length':true">
				<span>{{ comments[0].author }}</span> 
				<b style="float:right;">{{ comments.length }}</b>
			</div>-->
		</div>
    </div>

    <div class="text-options" (blur)="hideCommentOptions($event)" [style.top]="highlightY" [ngClass]="{ 'active' : optionsShow }">
		<div class="options">
			<span class="no-overflow">
				<span class="lengthen ui-inputs">
					<!--  <button id="addTextComment" class="">T</button>-->
					<button id="addEmojiComment" class="emoji" (click)="addEmojiComment($event)">
						<img alt="☺" class="emojioneemoji" src="https://cdnjs.cloudflare.com/ajax/libs/emojione/2.1.4/assets/png/263a.png">
					</button>
				</span>
			</span>
		</div>
	</div>

    <header id="annotatorTitle" class="header">
		{{ reading.title }}
	</header>  

	<div class="article-wrap" ng-class="{ 'comments-disabled' : showAllComments, 'loading' : loadingReading }">
        <!--Create components after load for reading-->
		<article class="content" (mouseup)="showCommentOptions($event)" (touchend)="showCommentOptions($event)" (clickOutside)="hideCommentOptions()">
			<span *ngFor="let word of reading.words; let i = index" class="word" [ngClass]="[ word.styles.join(' '), 'highlight-' + (highlightArray[i] ?  highlightArray[i] : 0)]" [attr.index]="i">
				<!--Comment Component-->
				<edji-comment *ngFor="let comment of commentsByIndex[i]; let ci = index" [comment]="comment" [isActive]="comment.active" (commentActivation)="setActiveCommentByIndex($event, i, ci)" (commentDeleted)="commentsByIndexRemove($event, i, ci)"></edji-comment>
				{{ word.str }}
			</span>
		</article>
		<emoji-keyboard [isActive]="activeComment.active && (!activeComment.type || activeComment.type === 'emoji')" [currentComment]="activeComment.data" (commentChange)="updateActiveComment($event)" (dismissKeyboard)="inactivateComment()"></emoji-keyboard>
	</div>
	
</div>
