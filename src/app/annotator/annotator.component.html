<div id="emojiAnnotator" class="annotator reading-page" [ngClass]="{ 'comment-expanded' : lineExpanded }">
    <div *ngIf="showAllComments" class="sliding-pane mid-bar from-left" [ngClass]="{ 'slide-in' : showCommentCounts }">
        <div class="container-fluid">
			</div>
    </div>
    <div *ngIf="project.types.length > 0" class="text-options" (blur)="hideCommentOptions($event)" [style.top]="highlightY + 'px'" [ngClass]="{ 'active' : optionsShow }">
		<div class="options hidden-md-down">
			<!--Desktop buttons-->
			<button *ngIf="project.types.indexOf('emoji') > -1" id="addEmojiComment" 
				class="emoji" 
				(click)="addEmojiComment($event)" 
				[innerHtml]="':thinking_face:' | emojione"></button>
			<button *ngIf="project.types.indexOf('text') > -1" 
				class="emoji" 
				id="addTextComment" 
				(click)="addTextComment($event)" 
				[innerHtml]="':writing_hand:' | emojione"></button>
		</div>
		<!--Mobile buttons-->
		<div class="comment-options__mobile-wrap hidden-lg-up">
			<div class="row comment__options--mobileRow">
				<div class="col-6 comment__options--mobileCol" *ngIf="project.types.indexOf('emoji') > -1" [ngClass]="project.types.indexOf('emoji') > -1 && project.types.indexOf('text') > -1 ? 'col-6' : 'col-12'">
					<button id="addEmojiComment" 
						class="emoji comment__options--mobileButton" 
						(tap)="addEmojiComment($event)" 
						[innerHtml]="':thinking_face:' | emojione"></button>
				</div>
				<div class="col-6 comment__options--mobileCol" *ngIf="project.types.indexOf('text') > -1" [ngClass]="project.types.indexOf('emoji') > -1 && project.types.indexOf('text') > -1 ? 'col-6' : 'col-12'">
					<button id="addTextComment"
						class="emoji comment__options--mobileButton" 
						(tap)="addTextComment($event)" 
						[innerHtml]="':writing_hand:' | emojione"></button>
				</div>
			</div>
		</div>
	</div>

	<div class="article-wrap">
        <!--Create components after load for reading-->
		<article id="annotatorContent" class="content active-content pt-4" (mouseup)="showCommentOptions($event)" (touchend)="showCommentOptions($event)" (clickOutside)="hideCommentOptions()">
			<span *ngFor="let w of reading.words; let i = index" class="w" [ngClass]="[ w.styles.join(' '), getHighlightClass(i) ]" 
				[attr.index]="i">
				<edji-comment *ngFor="let comment of commentsByIndex[i]; let ci = index" 
					[class.hidden]="(!project.heat_vision && user._id !== project.teacher_id) && comment.user_id !== user._id && comment.user_id !== project.teacher_id"
					[class.owner]="comment.user_id === project.teacher_id"
					[comment]="comment"
					(mouseenter)='focusHighlight(comment.start, comment.end, comment.loc)'
					(mouseleave)='unfocusHighlight(comment.start, comment.end, comment.loc)' 
					[readOnly]="comment.user_id !== user._id"
					[userPermission]="getCommentPermissions(comment)"
					[isActive]="comment.active" 
					(commentActivation)="setActiveCommentByIndex($event, i, ci)" 
					(commentDeleted)="removeComment(comment, i, ci)"
					(commentDeactivate)="unfocusHighlight($event.start, $event.end)"
					(commentUpdated)="updateAllLineCounts()"
					(expandLine)="expandLine($event, true)"
					(collapseLine)="expandLine($event, false)"
					(mobileActivation)="expandLine($event, true)"
					(mobileDeactivation)="expandLine($event, false)"
					(mobileDeactivate)="inactivateComment()"
					[class.imageComment]="comment['loc']"
					[style.top]="comment['loc'] ? getClosestRowY(comment['loc']['y']/100 * imageHeight[i]) + 'px' : '0px'">
				</edji-comment><a *ngIf="w.styles.indexOf('a') > -1" [attr.index]="i" [href]="(w.url && w.url.indexOf('//') > -1) ? w.url : ('//' + w.url)" target="_blank">{{w.str}}</a>{{ w.styles.indexOf('a') > -1 ? '' : w.styles.indexOf('space') > -1 ? '&nbsp;' : w.str }}<div *ngIf="w.styles.indexOf('img') > -1" class="img-wrap">
						<div *ngIf="imageHotspotPlaceholder.index == i && (imageHotspotPlaceholder.focus || imageHotspotPlaceholder.preview)" class="hotspot" [class.focused]="imageHotspotPlaceholder.focus" [style.left]="imageHotspotPlaceholder.x  + '%' " [style.top]="imageHotspotPlaceholder.y + '%' "></div>
						<div *ngFor="let comment of commentsByIndex[i]" [class.hidden]="(!project.heat_vision && user._id !== project.teacher_id) && comment.user_id !== user._id && comment.user_id !== project.teacher_id" class="hotspot" 
						[style.top]="comment['loc'] ? comment['loc']['y'] + '%' : '0%'" 
						[style.left]="comment['loc'] ? comment['loc']['x'] + '%' : '0%'"></div>
						<img class="reading-image" id="readingImage{{i}}" [attr.index]="i" [src]="w.url" (load)="updateImageHeights()" />
					</div></span>
		</article>
	</div>
</div>

<div class="button__row">
	<button *ngIf="user.type == 'temp'" [routerLink]="['/register']" [queryParams]="{ userId: user._id }" class="btn btn-secondary">Save this reading</button>
	<button *ngIf="reading && user.type == 'temp'" [routerLink]="['/register']" [queryParams]="{ reading: reading._id, userId: user._id }" class="btn btn-primary">Copy and edit</button>
	<button *ngIf="reading && user.type != 'temp' && user._id != reading.owner_id" [routerLink]="['/new-reading']" [queryParams]="{ copyId: reading._id }" class="btn btn-primary">Copy and edit</button>
</div>

<div class="fixed-btn-row--SE" [class.bottom-bar-offset]="user._id == project.teacher_id">
    <tutorial-box [tutorialName]="'highlighting'"
			[pageObjs]="guideContent" 
			[pager]="guideStepNo" 
			(pageChange)="guideStepNo = $event" 
			[class.keyboard-offset]="isEmojiKeyboardActive()"
			[class.mobile-toolbar-offset]="optionsShow"></tutorial-box>
    <edji-feedback></edji-feedback>
</div>

<emoji-keyboard [isActive]="isEmojiKeyboardActive()" [currentComment]="activeComment.data" (commentChange)="updateActiveComment($event)" (dismissKeyboard)="inactivateComment()"></emoji-keyboard>
