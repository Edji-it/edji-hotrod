<div id="emojiAnnotator" class="annotator reading-page" [ngClass]="{ 'comment-expanded' : lineExpanded }">
    <div *ngIf="showAllComments" class="sliding-pane mid-bar from-left" [ngClass]="{ 'slide-in' : showCommentCounts }">
        <div class="container-fluid">
			<!--<h4>
				<i class="fa fa-chevron-left btn-icon" ng-click="toggleCommentCounts()"></i>
				{{ studentCount() }} Students
			</h4> 
			<div class="user-list-item" style="opacity: 0.3; margin-bottom: 14px;">
				<span>Username</span> 
				<b style="float:right;">Comments</b>
			</div>
			<div class="user-list-item" ng-repeat="comments in commentsByUser | orderObjectBy:'length':true">
				<span>{{ comments[0].author }}</span> 
				<b style="float:right;">{{ comments.length }}</b>
			</div>-->
		</div>
    </div>

    <div *ngIf="project.types.length > 0" class="text-options" (blur)="hideCommentOptions($event)" [style.top]="highlightY" [ngStyle]="isMobile && optionLeft && { 'left': highlightX } || { 'right': highlightX }" [ngClass]="{ 'active' : optionsShow }">
		<div class="options">
			<!--<span class="no-overflow">-->
				<!--<span class="ui-inputs">-->
					<!--  <button id="addTextComment" class="">T</button>-->
					<button *ngIf="project.types.indexOf('emoji') > -1" id="addEmojiComment" class="emoji" (tap)="addEmojiComment($event)" [innerHtml]="':thinking_face:' | emojione"></button>
					<button *ngIf="project.types.indexOf('text') > -1" id="addTextComment" class="emoji" (tap)="addTextComment($event)" [innerHtml]="':writing_hand:' | emojione"></button>
				<!--</span>-->
			<!--</span>-->
		</div>
	</div>

    <header id="annotatorTitle" class="header">
		{{ reading.title }}
	</header>  

	<div class="article-wrap">
        <!--Create components after load for reading-->
		<article class="content" (mouseup)="showCommentOptions($event)" (touchend)="showCommentOptions($event)" (clickOutside)="hideCommentOptions()">
			<span *ngFor="let word of reading.words; let i = index" 
				class="word"
				[ngClass]="[ word.styles.join(' '), getHighlightClass(i) ]" 
				[attr.index]="i"
				(click)="onTouch(i)">
				<edji-comment *ngFor="let comment of commentsByIndex[i]; let ci = index" 
					[comment]="comment"
					(mouseenter)='focusHighlight(comment.start, comment.end)'
					(mouseleave)='unfocusHighlight(comment.start, comment.end)' 
					[readOnly]="comment.user_id !== user._id"
					[isActive]="comment.active" 
					(commentActivation)="setActiveCommentByIndex($event, i, ci)" 
					(commentDeleted)="removeComment(comment, i, ci)"
					(expandLine)="expandLine($event)"
					[isMobile]="isMobile"
					(mobileDeactivate)="inactivateComment()">
				</edji-comment>{{ word.str.trim() ? word.str : '&nbsp;' }}</span>
		</article>
		
	</div>
</div>
<div [ngClass]="{ 'mobile__comment-background' : mobileCommentShow }"></div>
<emoji-keyboard [isActive]="activeComment.active && (!activeComment.type || activeComment.type === 'emoji') && activeComment.user_id === user._id" [currentComment]="activeComment.data" (commentChange)="updateActiveComment($event)" (dismissKeyboard)="inactivateComment()"></emoji-keyboard>
<hot-login-modal *ngIf="showLoginModal" (closeModal)="showLoginModal = false"></hot-login-modal>
