<form [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">
  <div class="form-group">
    <div class="e2e-clickaway"></div>
    <label for="usernameInput">Username or Email</label>
    <input type="text" id="usernameInput" [placeholder]="'e.g. ' + userCopy.username"
      [formControl]="loginForm.controls['username']" tabindex="0" />
    <div class="alert alert-danger"
      *ngIf="loginForm.controls['username'].hasError('required') && (loginForm.controls['username'].dirty)">Hey there!
      Make sure to add a username!</div>
  </div>
  <div class="form-group">
    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" [placeholder]="'e.g. &#9679;&#9679;&#9679;&#9679;&#9679;&#9679;'"
      [formControl]="loginForm.controls['password']" tabindex="0" />
    <div id="msgNoPassword" class="alert alert-danger"
      *ngIf="loginForm.controls['password'].hasError('required') && (loginForm.controls['password'].dirty)">Howdy
      Partner, why don't you add a password?</div>
    <div id="msgError" class="alert alert-danger" *ngIf="errorObject.loginFailed">{{errorObject.loginFailed}}</div>
    <div id="msgServerError" class="alert alert-danger" *ngIf="errorObject.serverError">{{errorObject.serverError}}
    </div>
  </div>
  <div class="button__row">
    <button id="buttonLogin" type="submit" [class.loading]="loginLoading" class="btn btn-primary" name="Login"
      tabindex="0">{{ submitText }}</button>
  </div>

</form>
