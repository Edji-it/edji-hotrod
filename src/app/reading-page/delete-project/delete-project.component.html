<div id="deleteProjectModal" class="modal fade-in show">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Delete Project</h4>
                <button (click)="closeModal.emit()" type="button" class="close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you would like to delete '{{ project.label }}'?</p>
            </div>
            <div class="modal-footer">
                <div *ngIf="showError" class="alert alert-danger" role="alert">
                  <strong>Oh snap!</strong> Unable to delete Project.
                </div>
              <div class="btn-row right">
                <button (click)="closeModal.emit()" type="button" class="btn" data-dismiss="modal">Close</button><!--not sure what data-dismiss does-->
                <button (click)="deleteProject()" class="btn btn-primary">Confirm Delete</button>
              </div>
            </div>
        </div>
    </div>
</div>
