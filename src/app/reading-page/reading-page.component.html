<div style="height:100%;">
  <side-bar has-comment-count="true"></side-bar>

  <section class="reading-column paper" [ngClass]="{ loading: isLoading }">
    <header id="annotatorTitle" class="header">{{ reading.title ? reading.title : "Untitled Reading" }}</header>
    <div *ngIf="reading.source" class="sub-heading">
        <img alt="📖" class="emojioneemoji" src="assets/emoji/png/1f4d6.png"> 
        <a title="Source" href="{{reading.source}}" target="_blank">{{reading.source}}</a>
    </div>
    <p *ngIf="error" class="banner-error">{{ error }}</p>
    <div class="article-wrap">
      <article id="annotatorText" class="content" [innerHtml]="reading.html"></article>
    </div>
  </section>
  
  <div class="reading__hud">
    <label>{{ reading.label }}</label>
    
    <div class="hud__info"> 
      <pre class="reading-code--inline">{{reading.code || 'none'}}</pre>
        <img class="emojioneemoji" src="assets/emoji/png/1f511.png">
      <br/>
      {{liveCount}} Readers 
        <img ng-show="true" alt="🔥" class="emojioneemoji" src="https://cdnjs.cloudflare.com/ajax/libs/emojione/2.1.4/assets/png/1f525.png">
    </div>
  </div>

  <!--<feedback-form *ngIf="user.isTeacher"></feedback-form>-->
</div>
