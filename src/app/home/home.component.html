<div class="gray">
  <nav-bar [isLarge]="true"></nav-bar>
  <div class="container-fluid">
    <div class="col-sm-6 col-pad">
        <h1 class="center">Read Together</h1>
        <h2 class="center">Add highlights with text or emoji</h2>
        <img class="promo-gif" loop="infinite" src="assets/images/promo-highlight.gif" />
        <hr />
        <!--<h1 class="center">Add Meaningful Emoji</h1>
        <img class="promo-gif" loop="infinite" src="assets/images/promo-comment.gif" />-->
        <!--<br />
        <hr />
        <br />-->
        <h2 class="center">Then discuss with the Heatmap!</h2>
        <img class="promo-gif" loop="infinite" src="assets/images/promo-heatmap.gif" />

    </div>
    <div class="col-sm-6 col-pad">
      <!--Lightning Code Row-->
      <div *ngIf="!showLogin">
        <h2 class="center">Enter with <img class="inline-emoji emojioneemoji" src="assets/emoji/png/26a1.png" />Code</h2>
        <input type="text" id="projectCodeInput" class="big-field lowercase-field on-white" (keyup.enter)="joinSession(sessionCode)" [(ngModel)]="sessionCode" placeholder="Code" />
        <!--<p class="center">Join a project without an account</p>-->
        <div class="button__row"> 
            <button (click)="joinSession(sessionCode)" class="button" id="buttonJoinProject" name="Join" href="#">Go!</button>
        </div>
        <div id="msgInvalidCode" *ngIf="errorObject.invalidCode" [innerHtml]="errorObject.invalidCode | emojione" class="alert alert-danger"></div>
      </div>

      <br />
      <hr>
      <br />
      <!--Login Row-->
      <!--<div *ngIf="showLogin">-->
        <form [formGroup]="loginForm" (ngSubmit)="login(loginForm.value)">
          <h2 class="center">Login to your Dashboard</h2>
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" [formControl]="loginForm.controls['username']" tabindex="0" />
          <div class="alert alert-danger" *ngIf="loginForm.controls['username'].hasError('required') && (loginForm.controls['username'].dirty || loginForm.submitted)">A username is required</div>
          
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" [formControl]="loginForm.controls['password']" tabindex="0" />
          <div id="msgNoPassword" class="alert alert-danger" *ngIf="loginForm.controls['password'].hasError('required') && (loginForm.controls['password'].dirty || loginForm.submitted)">A password is required</div>
          <div id="msgErrorPassword" class="alert alert-danger" *ngIf="errorObject.incorrect">{{errorObject.incorrect}}</div>
          
          <div class="button__row" [class.loading]="loginLoading">
            <!--ngHide loginLoading-->
            <button id="buttonLogin" type="submit" class="button" name="Login" tabindex="0">Login</button>
          </div>
          
        </form>
        <div style="text-align:center;">
          <a id="linkForgotPassword" class="link" (click)="showPassModal = !showPassModal">Forgotten password?</a>
        </div>
      <!--</div>-->
      <br />
      <hr>
      <br />
      <div class="button__row">
        <button id="buttonGoRegister" class="btn btn-secondary" name="Register" [routerLink]="['/register']" tabindex="0">Register</button>
      </div>
    </div>
  </div>
</div>

<edji-reset-pass *ngIf="showPassModal"  (closeModal)="showPassModal = !showPassModal"></edji-reset-pass>
