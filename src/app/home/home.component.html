<div class="gray">
  <nav-bar [isLarge]="true" [showLinks]="true"></nav-bar>
  <div class="container-fluid">
    <div class="row navy">
      <div class="col-sm-8">
        <div class="promo-image__wrap">
          <img src="/assets/images/promo-home.svg" />
        </div>
      </div>
      <div class="col-sm-4 col-pad">
        <!--Lightning Code Row-->
        <div class="col__center-fix">
          <div class="col__center-content">
            <h1 class="center on-dark join-header">Join a Project now!</h1>
            <div class="input-group input-group-lg">
              <input id="projectCodeInput" type="text" class="form-control" style="text-align: center;" maxlength="4" (keyup.enter)="joinSession(sessionCode)" [(ngModel)]="sessionCode"  placeholder="⚡️ Code" aria-describedby="add-project-code">
              <span class="input-group-btn">
                <button class="btn btn-primary" type="button" (click)="joinSession(sessionCode)" id="buttonJoinProject" name="Join" href="#">Go!</button>
              </span>
            </div>
            
            <div class="demo-copy" (click)="sessionCode = 'd3m0'">
                <span>No code? Try this:&nbsp;</span>
                <pre>d3m0</pre>
            </div>
            <!--<input type="text" id="projectCodeInput" class="big-field lowercase-field on-white" placeholder="⚡️ Code" />-->
            <!--<p class="center">Join a project without an account</p>-->
            <div id="msgInvalidCode" *ngIf="errorObject.invalidCode" [innerHtml]="errorObject.invalidCode | emojione" class="alert alert-danger"></div>
          </div>
        </div>
      </div>
    </div>
    <!--Row below promo-->
    <div class="row promo-row">
      <div class="col-sm-6">
          <h1>Read Together</h1>
          <h2>Add highlights with text or emoji</h2>
      </div>
      <div class="col-sm-6">
          <img class="promo-gif" loop="infinite" src="assets/images/promo-highlight.gif" />
      </div>
    </div>
    <div class="row promo-row">
       <div class="col-sm-6">
          <img class="promo-gif" loop="infinite" src="assets/images/promo-heatmap.png" />
       </div>
       <div class="col-sm-6">
          <h2>Then discuss with the Heatmap!</h2>
       </div>
      </div>
  </div><!--container-fluid-->
</div>

<edji-reset-pass *ngIf="showPassModal"  (closeModal)="showPassModal = !showPassModal"></edji-reset-pass>
