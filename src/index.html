<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  
    <!--Force not caching index.html to make sure user gets updated version-->
  <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="pragma" content="no-cache">

  <!-- For google verification (this helps with YouTube Stuff) -->
  <meta name="google-site-verification" content="1UKcDRu2sXi_q-pDcmCJ0Do2pFb0-PQxISzhg_cuJYE" />

   <!-- social media tags -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@edjinotes">
  <meta name="twitter:title" content="Edji">
  <meta name="twitter:description" content="Reading made visible, social, live!">
  <meta name="twitter:creator" content="@edjinotes">
  <meta property="og:title" content="Edji" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="http://edji.it/assets/ogp/ogp-graphic.png" />
   <meta property="og:url" content="http://edji.it" /> 
  <meta property="og:description" content="Reading made visible, social, live!">

  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">

  <title><%= htmlWebpackPlugin.options.title %></title>

  <meta name="description" content="<%= htmlWebpackPlugin.options.title %>">

  <% if (webpackConfig.htmlElements.headTags) { %>
  <!-- Configured Head Tags  -->
  <%= webpackConfig.htmlElements.headTags %>
  <% } %>

  <!-- base url -->
  <base href="<%= htmlWebpackPlugin.options.metadata.baseUrl %>">

  <!--HammerJS library-->
  <script src="/assets/js/h.js"></script>

  <!--Stripe JS-->
  <script type="text/javascript" src="https://js.stripe.com/v3/"></script>
  <script src="//checkout.stripe.com/checkout.js"></script>

  -->
  <div id="buildNumber" style="padding: 9px; font-size: 10px; display:block; width: 100%; font-family:'Open Sans'; text-align: center; color: #ccc;">
    Build <%= htmlWebpackPlugin.options.metadata.version %></div>
  <% if (htmlWebpackPlugin.options.metadata.isDevServer && htmlWebpackPlugin.options.metadata.HMR !== true) { %>
  <!-- Webpack Dev Server reload -->
  <script src="/webpack-dev-server.js"></script>
  <% } %>
